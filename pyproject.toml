[project]
name = "coach"
version = "0.1.0"
description = "League of Legends coach: RAG over podcast transcripts + live game data"
requires-python = ">=3.12,<3.13"
dependencies = [
    "av<16",
    "faster-whisper>=1.2.1",
    "jellyfish>=1.3.0",
    "pydantic>=2.7",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "yt-dlp[default]>=2025.10.22",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coach"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
