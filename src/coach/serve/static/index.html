<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BBC Coach</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --text: #1c1b19; --muted: #6b6862; --line: #e3e0da;
    --accent: #b4532a; --accent-soft: #f6e6dd; --user: #1f3b57; --user-text: #ffffff;
    --code: #f0eee9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151413; --panel: #1e1d1b; --text: #ece9e3; --muted: #9b968d; --line: #2f2d2a;
      --accent: #e0814f; --accent-soft: #3a2a21; --user: #2c4a68; --user-text: #f3f6f9;
      --code: #2a2825;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .2px; }
  header h1 span { color: var(--accent); }
  .who { display: flex; gap: 8px; align-items: center; margin-left: auto; flex-wrap: wrap; }
  .who input, .who select {
    font: inherit; font-size: 13px; padding: 6px 8px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
  }
  .who input { width: 170px; }
  button {
    font: inherit; font-size: 13px; cursor: pointer; border-radius: 8px; padding: 6px 12px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
  }
  button:hover { border-color: var(--muted); }
  main { flex: 1; overflow-y: auto; }
  .thread { max-width: 780px; margin: 0 auto; padding: 24px 16px 8px; }
  .empty { text-align: center; color: var(--muted); padding: 48px 0 16px; }
  .empty h2 { color: var(--text); font-size: 20px; margin: 0 0 6px; }
  .starters { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; margin-top: 20px; }
  .starters button { text-align: left; padding: 10px 12px; line-height: 1.4; }
  .msg { margin: 0 0 18px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 100%; }
  .user .bubble {
    background: var(--user); color: var(--user-text); padding: 9px 14px;
    border-radius: 14px 14px 4px 14px; max-width: 85%; white-space: pre-wrap;
  }
  .coach .bubble {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 4px 18px; width: 100%;
  }
  .coach .bubble h2 { font-size: 15px; margin: 16px 0 4px; }
  .coach .bubble h3 { font-size: 14px; margin: 14px 0 4px; }
  .coach .bubble p { margin: 10px 0; }
  .coach .bubble ul, .coach .bubble ol { padding-left: 22px; margin: 8px 0; }
  .coach .bubble li { margin: 5px 0; }
  .coach .bubble a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-soft); }
  .coach .bubble a:hover { border-bottom-color: var(--accent); }
  .coach .bubble code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .thinking { color: var(--muted); padding: 12px 0; display: flex; align-items: center; gap: 10px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s infinite ease-in-out; }
  @keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  .error { color: #c0392b; }
  footer { border-top: 1px solid var(--line); background: var(--panel); }
  form { max-width: 780px; margin: 0 auto; padding: 12px 16px 16px; display: flex; gap: 8px; }
  textarea {
    flex: 1; resize: none; font: inherit; padding: 10px 12px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
    min-height: 44px; max-height: 160px;
  }
  textarea:focus, .who input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  form button { background: var(--accent); color: #fff; border: none; padding: 0 18px; border-radius: 12px; font-size: 14px; }
  form button:disabled { opacity: .5; cursor: default; }
  .hint { max-width: 780px; margin: -8px auto 0; padding: 0 16px 10px; color: var(--muted); font-size: 12px; }
  @media (max-width: 600px) { .who { margin-left: 0; width: 100%; } .who input { flex: 1; width: auto; } }
</style>
</head>
<body>
<header>
  <h1>BBC <span>Coach</span></h1>
  <div class="who">
    <input id="riot" placeholder="Riot ID (Name#TAG), optional" autocomplete="off">
    <select id="platform" aria-label="Server">
      <option>na1</option><option>euw1</option><option>eun1</option><option>kr</option>
      <option>br1</option><option>la1</option><option>la2</option><option>oc1</option>
      <option>tr1</option><option>jp1</option><option>ru</option>
    </select>
    <button id="reset" type="button">New chat</button>
  </div>
</header>
<main id="scroll">
  <div class="thread" id="thread">
    <div class="empty" id="empty">
      <h2>Ask the Broken by Concept coach</h2>
      <div>Answers come from 327 episodes, with links to the exact moment they said it.</div>
      <div class="starters" id="starters">
        <button>I'm hardstuck Emerald. Should I one-trick or play a few champs?</button>
        <button>What is the mental stack, and how do I free it up in game?</button>
        <button>How many ranked games should I play a day to actually improve?</button>
        <button>How do I stop tilting after a loss?</button>
      </div>
    </div>
  </div>
</main>
<footer>
  <form id="form">
    <textarea id="q" rows="1" placeholder="Ask about a matchup, a habit, your mental, anything" autofocus></textarea>
    <button id="send" type="submit">Ask</button>
  </form>
  <div class="hint">Enter to send, Shift+Enter for a new line. Answers take about 30 to 90 seconds.</div>
</footer>
<script>
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  const newId = () => (crypto.randomUUID ? crypto.randomUUID() :
    "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c =>
      (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)));
  let session = newId();
  let busy = false;

  $("riot").value = store.get("riot") || "";
  $("platform").value = store.get("platform") || "na1";
  $("riot").addEventListener("change", () => store.set("riot", $("riot").value.trim()));
  $("platform").addEventListener("change", () => store.set("platform", $("platform").value));

  // Minimal markdown: escape first, then headings, lists, bold, italics, links, code.
  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function inline(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
  }
  function markdown(md) {
    const out = [];
    let list = null, para = [];
    const flushPara = () => { if (para.length) { out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; } };
    const flushList = () => { if (list) { out.push(`<${list.tag}>${list.items.map(i => "<li>" + inline(i) + "</li>").join("")}</${list.tag}>`); list = null; } };
    for (const raw of md.split("\n")) {
      const line = raw.trimEnd();
      let m;
      if (!line.trim()) { flushPara(); flushList(); continue; }
      if ((m = line.match(/^(#{1,4})\s+(.*)/))) {
        flushPara(); flushList();
        const level = Math.min(m[1].length + 1, 3);
        out.push(`<h${level}>${inline(m[2])}</h${level}>`);
      } else if ((m = line.match(/^\s*[-*]\s+(.*)/)) || (m = line.match(/^\s*\d+[.)]\s+(.*)/))) {
        flushPara();
        const tag = /^\s*\d/.test(line) ? "ol" : "ul";
        if (!list || list.tag !== tag) { flushList(); list = { tag, items: [] }; }
        list.items.push(m[1]);
      } else if (list && /^\s{2,}/.test(raw)) {
        list.items[list.items.length - 1] += " " + line.trim();
      } else {
        flushList(); para.push(line.trim());
      }
    }
    flushPara(); flushList();
    return out.join("");
  }

  function add(role, html) {
    $("empty")?.remove();
    const msg = document.createElement("div");
    msg.className = "msg " + role;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = html;
    msg.appendChild(bubble);
    $("thread").appendChild(msg);
    $("scroll").scrollTop = $("scroll").scrollHeight;
    return bubble;
  }

  async function ask(question) {
    if (busy || !question.trim()) return;
    busy = true; $("send").disabled = true;
    add("user", esc(question));
    const started = Date.now();
    const bubble = add("coach", '<div class="thinking"><div class="dot"></div><span>Searching the podcast… 0s</span></div>');
    const label = bubble.querySelector("span");
    const timer = setInterval(() => {
      label.textContent = `Searching the podcast… ${Math.round((Date.now() - started) / 1000)}s`;
    }, 1000);
    try {
      const res = await fetch("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session, question, riot_id: $("riot").value.trim(), platform: $("platform").value }),
      });
      const data = await res.json().catch(() => ({}));
      bubble.innerHTML = res.ok ? markdown(data.answer || "")
        : `<p class="error">${esc(data.error || "Something went wrong (" + res.status + ").")}</p>`;
    } catch (e) {
      bubble.innerHTML = `<p class="error">Couldn't reach the coach. Is the server still running?</p>`;
    } finally {
      clearInterval(timer);
      busy = false; $("send").disabled = false;
      $("scroll").scrollTop = $("scroll").scrollHeight;
      $("q").focus();
    }
  }

  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const q = $("q").value; $("q").value = ""; grow(); ask(q);
  });
  $("q").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
  });
  const grow = () => { $("q").style.height = "auto"; $("q").style.height = Math.min($("q").scrollHeight, 160) + "px"; };
  $("q").addEventListener("input", grow);
  $("starters").addEventListener("click", (e) => { if (e.target.tagName === "BUTTON") ask(e.target.textContent); });
  $("reset").addEventListener("click", () => {
    if (busy) return;
    fetch("/api/reset", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ session }) });
    session = newId();
    location.reload();
  });
</script>
</body>
</html>
