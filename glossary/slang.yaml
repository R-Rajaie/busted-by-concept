- {term: dragon soul, meaning: fourth-dragon buff, core: true}
- {term: Elder, meaning: Elder Dragon, core: true}
- {term: tilt, meaning: playing worse from frustration, core: true}
- {term: MMR, meaning: hidden matchmaking rating, core: true}
- {term: LP, misheard: [L.P.], meaning: league points, core: true}
