# Hand-curated League jargon and host catchphrases. Do not bulk-generate.
# Add a term when an eval or correction log shows Whisper missing it.
#   term:     canonical spelling
#   misheard: transcription errors seen in practice (used by the fuzzy matcher)
#   meaning:  short gloss, for the LLM correction pass
#   core:     true = always included in the per-episode hotword list

- {term: CS, meaning: creep score, core: true}
- {term: SoloQ, misheard: [solo queue, solo cue], meaning: ranked solo/duo queue, core: true}
- {term: gank, meaning: jungler attacking a lane, core: true}
- {term: jungler, meaning: jungle role player, core: true}
- {term: ADC, misheard: [A.D.C., a DC], meaning: bot lane carry, core: true}
- {term: wave management, meaning: controlling minion wave position, core: true}
- {term: freeze, meaning: holding the wave near your tower, core: true}
- {term: slow push, meaning: building a large wave gradually, core: true}
- {term: crash, meaning: pushing a wave into the enemy tower, core: true}
- {term: back timing, misheard: [back time], meaning: when to recall, core: true}
- {term: tempo, meaning: time advantage from moving first, core: true}
- {term: prio, misheard: [preo, pre-o], meaning: lane priority, core: true}
- {term: roam, meaning: leaving lane to affect another, core: true}
- {term: TP, misheard: [teepee], meaning: Teleport summoner spell, core: true}
- {term: Flash, meaning: Flash summoner spell, core: true}
- {term: Ignite, meaning: Ignite summoner spell, core: true}
- {term: Baron, misheard: [barren], meaning: Baron Nashor objective, core: true}
- {term: Herald, meaning: Rift Herald objective, core: true}
