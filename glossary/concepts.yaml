  - episode_id: m5nCBykuiVM
    t: 1476
- term: cheese
  aliases:
  - cheesing
  - cheese builds
  - cheese pairings
  - cheesy
  meaning: Doing something out of the ordinary that isn't good on paper but works in practice because
    the opponent doesn't expect it, instead of simply playing better than them. Examples are a level 1
    or 2 invade or gank, or an off-meta build like Halo Blade plus Ignite Tryndamere. It's unpredictable
    and dishonest play, as opposed to consistent play. The hosts say they don't encourage it. It can gain
    rank quickly, but it's an unsustainable band-aid shortcut that League eventually punishes.
  sources:
  - episode_id: A5Jwx8XbJag
    t: 3641
  - episode_id: 6P9m6SQG7jU
