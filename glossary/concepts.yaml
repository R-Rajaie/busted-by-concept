  - episode_id: uZQvmLrUVKM
    t: 3302
  - episode_id: uZQvmLrUVKM
    t: 5615
- term: red light green light
  aliases: []
  meaning: 'A framework that splits the game into states by whether it''s your turn to make plays. In
    a green light your team is on the map (for example back from base with items, with the man advantage),
    so you can be aggressive: skip camps, ganking, entering their jungle, taking space. In a red light
    your team is off the map, meaning in base, stuck clearing waves, low HP or too far away to help, or
    your strongest member is away or the enemy has a big built-up wave, so you shouldn''t make plays or
    walk into danger. An orange (yellow) light is an even, contested in-between state that needs more
    nuance and creativity, and the hosts treat it as a more advanced step after learning red and green.
    The states change constantly, and the hosts use the framework as a simple starting point for good
    habits.'
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 2358
  - episode_id: EgAO9qiKYm4
    t: 9156
  reviewed: suggested
- term: mechanics
  aliases:
  - mechanics and micro
  - inputs
  meaning: 'Mechanics are the inputs that dictate how your character moves and interacts with the game:
    the quality of your clicks, skillshots and movement on keyboard and mouse. The hosts say it''s often
    used interchangeably with micro, though Curtis once framed it as an umbrella that also covers the
    strategy of how you move, and he wasn''t sure he had the labels the right way round. "Mechanics maxing"
    means putting nearly all your focus on clean inputs, which can lift your play above baseline but costs
    mental stack and attention to macro.'
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 2474
  - episode_id: EgAO9qiKYm4
    t: 2611
  reviewed: revised
- term: mechanics maxing
  aliases:
  - mechanic max
  meaning: Putting energy and focus into clicking fast and accurately and using abilities effectively,
    which can lift you above baseline and outplay opponents.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 2661
- term: micro
  aliases:
  - micro (versus macro)
  - execution
  meaning: 'Micro is the execution aspect of the game: how you turn raw mechanical inputs into intentional
    play, covering ability usage, timing, positioning and target selection in a fight. It is separate
    from mechanics, which are the raw inputs, and it is the opposite of macro, which covers strategic
    decisions such as whether to attend a fight at all. The hosts review a fight ''through a micro lens''
    when they look at how it was executed.'
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 2957
  - episode_id: EgAO9qiKYm4
    t: 2878
  - episode_id: EgAO9qiKYm4
    t: 3038
  reviewed: suggested
- term: macro
  aliases:
  - macro decision
  meaning: Macro is the umbrella term for bigger-picture strategic decision making that aligns with win
    conditions. It covers things like win condition assessment, whether to gank, whether to reset on a
    wave, rotations, and probably item builds. It is the opposite of micro, which is the execution of
    a fight (ability usage, timing, positioning, target selection). Factors such as win conditions or
    who is strong or weak inform a macro decision, but the decision itself is the macro part.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 2902
  - episode_id: EgAO9qiKYm4
    t: 2993
  - episode_id: EgAO9qiKYm4
    t: 3068
  reviewed: suggested
- term: micro macro framework
  aliases:
  - zoom in then zoom out
  - micro first, then macro
  - micro macro it up
  meaning: 'A review method the hosts use to simplify reviews. You look at a play (a fight, a gank death,
    a wave position) first through a micro lens: ability usage, timing, positioning, and target selection.
    Then you zoom out to macro: should I even be here, was this a good fight to take, what are the map
    state, jungler location, and win condition. You start with micro because big micro findings usually
    mean it wasn''t a macro problem (if you could play it better and win, it was an okay play), but you
    should do both so you don''t jump to a conclusion either way.'
  sources:
  - episode_id: ANlsvzO-fdc
    t: 2081
  - episode_id: 2WQ8zHtK6fc
    t: 2032
  - episode_id: EgAO9qiKYm4
