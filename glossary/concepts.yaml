    t: 1436
- term: intent
  aliases:
  - intention
  - playing with intention
  - having an intent
  - play with intention
  meaning: Making decisions consciously with a reason behind them, as opposed to autopilot or being sucked
    into plays. Each decision rests on a hypothesis, even a basic or wrong one, so you can test it and
    learn.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 1103
  - episode_id: EgAO9qiKYm4
    t: 5483
  - episode_id: 1AO2iZwUt9s
    t: 5236
- term: levels of intention
  aliases:
  - quality of intention
  meaning: Intention exists on a spectrum from simplistic (he's low, I'll kill him) to hyper-intentional,
    and even a little is better than none and deepens as you learn.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 5582
- term: autopilot
  aliases:
  - intuition
  - muscle memory
  - instinct
  - monkey brain
  meaning: 'Decisions made solely from muscle memory and pattern recognition. Not necessarily bad: the
    best play combines intention for strategy with intuition for obvious lower-level decisions.'
  sources:
  - episode_id: EgAO9qiKYm4
    t: 5714
- term: champion identity
  aliases:
  - champ identity
  - clear identity
  - champ's identity
  meaning: What a champion fundamentally is about, its strengths, weaknesses and why it wants to do what
    it does. It lets you think as the champion, mainly tells you what to avoid, and dictates decisions
    so fundamentals make sense.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 1384
  - episode_id: EgAO9qiKYm4
    t: 216
  - episode_id: 1AO2iZwUt9s
    t: 4519
  - episode_id: uZQvmLrUVKM
    t: 2003
  - episode_id: uZQvmLrUVKM
    t: 2794
- term: champion reference points
  aliases:
  - reference points
  - reference point
  - key reference points
  - baseline reference points
  meaning: Practical, champion-specific guidelines based on its strengths and weaknesses (fight around
    your ult, recall on a certain item, play off your ult cooldown). They set walls around your gameplay,
    give consistency and a resting point when the game gets confusing; if identity is the why, reference
    points are the what.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 1539
  - episode_id: EgAO9qiKYm4
    t: 536
  - episode_id: EgAO9qiKYm4
    t: 672
  - episode_id: G1A0U5bJRZM
    t: 700
  - episode_id: 1AO2iZwUt9s
    t: 884
  - episode_id: 1AO2iZwUt9s
    t: 2215
  - episode_id: 1AO2iZwUt9s
    t: 5267
  - episode_id: uZQvmLrUVKM
    t: 2794
  - episode_id: uZQvmLrUVKM
    t: 3226
- term: champion mastery
  aliases:
  - champ mastery
  - next level of champ mastery
  meaning: 'Not mastery points, but time spent playing a champion with intensity and intentional repetition:
    knowing its identity, reference points, limits, and how to win even hard games. It covers both knowledge
    and execution and is the bedrock that frees mental stack for role and game mastery.'
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 1859
  - episode_id: 2WQ8zHtK6fc
    t: 793
  - episode_id: EgAO9qiKYm4
    t: 47
  - episode_id: 1AO2iZwUt9s
    t: 2531
  - episode_id: rWp2ZO2zHy4
    t: 5115
- term: master of the champion
  aliases: []
  meaning: Someone who has performed with the champion at Master+ rank; below that a player may have mechanics
    but lacks the champion's macro limitations, so has half the mastery.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 1952
- term: champion first, game fundamentals second
  aliases:
  - champion mastery before fundamentals
  - champ mastery first
  - learn the game through a champion
  meaning: Learn the game through the lens of one champion (ability usage, damage, trading, ult use) before
    generic fundamentals like wave management, warding or roaming, over roughly 60-80 games for beginners.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 195
  - episode_id: 1AO2iZwUt9s
    t: 5410
  - episode_id: 1AO2iZwUt9s
    t: 5495
- term: champion mastery → role mastery → game mastery
  aliases:
  - mastery order
  - bedrock of champ mastery
  meaning: 'The learning order: champion mastery frees mental stack for role mastery, which frees you
    for bigger game concepts and comps. You can''t skip steps.'
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 1053
- term: can play a champion
  aliases:
  - I can play the champ
  - pilot the champion
  meaning: Piloting a champion through every part of every game, adapting to role, win condition and comp;
    isolated good trades or kills don't count.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 905
- term: win condition
  aliases:
  - win con
  - win conditions
  - win condition assessment
  - win con assessment
  - reading a win con
  meaning: A strategic avenue for winning a game based on kit strengths, who is fed or weak, and objectives;
    it can change and several can coexist. Reading whether you or someone else is the win condition has
    a high skill cap and becomes a big focus around Emerald+.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 2129
  - episode_id: EgAO9qiKYm4
    t: 4299
  - episode_id: uZQvmLrUVKM
    t: 3302
  - episode_id: uZQvmLrUVKM
    t: 5615
- term: red light green light
  aliases:
  - red light
  - green light
  - orange light
  meaning: 'Nathan''s framework for map windows: green light means your team is on the map and it''s your
    turn to make plays; red light means your strong teammates are off the map or the enemy has a big wave,
    so there''s no play; yellow/orange is ambiguous and needs more creativity.'
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 2358
  - episode_id: EgAO9qiKYm4
    t: 9156
- term: mechanics
  aliases:
  - mechanics and micro
  - inputs
  meaning: The raw inputs that dictate how your character moves and interacts (clicks, skillshots, movement,
    dodging), as well as the strategy of how you move. Most players struggle more with the strategic side
    than raw inputs.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 2474
  - episode_id: EgAO9qiKYm4
    t: 2611
- term: mechanics maxing
  aliases:
  - mechanic max
  meaning: Putting energy and focus into clicking fast and accurately and using abilities effectively,
    which can lift you above baseline and outplay opponents.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 2661
- term: micro
  aliases:
  - micro (versus macro)
  - micro oriented player
  - execution
  meaning: 'The execution side of the game: mechanics turned into intentional ability usage, timing, positioning
    and fighting, as opposed to big-picture strategy.'
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 2957
  - episode_id: EgAO9qiKYm4
    t: 2878
  - episode_id: EgAO9qiKYm4
    t: 3038
- term: macro
  aliases:
  - macro decision
  - macro oriented player
  meaning: An umbrella term for bigger-picture strategic decision making aligned with win conditions (rotations,
    ganks, resets, builds); any decision not about executing a fight.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 2902
  - episode_id: EgAO9qiKYm4
    t: 2993
  - episode_id: EgAO9qiKYm4
    t: 3068
- term: micro macro framework
  aliases:
  - zoom in then zoom out
  - micro first, then macro
  - micro/macro lens
  - micro macro it up
  - micro/macro review
  meaning: 'A review method: first look at a play through a micro lens (ability usage, target selection,
    positioning), then zoom out to macro (should you have been there, map state, win condition). Start
    with micro because if it can be played better mechanically, it''s not a macro problem.'
  sources:
  - episode_id: ANlsvzO-fdc
    t: 2081
  - episode_id: 2WQ8zHtK6fc
    t: 2032
  - episode_id: EgAO9qiKYm4
    t: 3011
  - episode_id: EgAO9qiKYm4
    t: 3121
  - episode_id: EgAO9qiKYm4
    t: 9355
  - episode_id: G1A0U5bJRZM
    t: 2142
  - episode_id: uZQvmLrUVKM
    t: 4960
- term: spacing and tethering
  aliases:
  - tethering
  - spacing
  meaning: Using your range relative to the enemy's to deal damage while taking none, staying out of their
    spell and auto ranges while remaining in yours.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 2611
  - episode_id: EgAO9qiKYm4
    t: 3171
- term: anticipation
  aliases: []
  meaning: Thinking ahead about what the opponent might do, the real reason players seem to dodge key
    abilities and tether; ties into occupying the enemy's mental stack.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 3283
- term: short clicks and long clicks
  aliases:
  - short and long clicks
  meaning: Short clicks near your character let you turn quickly; long clicks send you far. Mixing them
    makes movement unpredictable and skillshots hard to land.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 2757
- term: high value death versus low value death
  aliases:
  - high value death
  - low value death
  - game winning death
  - high quality death
  - low quality death
  meaning: Judge a death by net gold, experience, time and resources gained and lost. A high value death
    makes the enemy burn summoners and ults and waste waves while you cost your team little; a low value
    death (bounty, stacked wave, Baron spawning, you burn flash) gives the enemy a cheap kill.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 2987
  - episode_id: Jbw9Dq4GWUc
    t: 3071
  - episode_id: Jbw9Dq4GWUc
    t: 3094
- term: high value kill versus low value kill
  aliases: []
  meaning: 'The same idea for kills: a kill is low value if you burn a key cooldown, like your ult on
    the support, and lack it for the next fight.'
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 3116
- term: high quality questions
  aliases:
  - high quality question versus low quality question
  - low quality questions
  - general questions get general answers
  - series of high quality questions
  meaning: The quality of the answer depends on the question. High quality questions are specific, controllable,
    show accountability and curiosity (and can be used to refocus when tilted); low quality ones are vague,
    venting or blame-shifting.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 3172
  - episode_id: ANlsvzO-fdc
    t: 4591
  - episode_id: 2WQ8zHtK6fc
    t: 2225
  - episode_id: EgAO9qiKYm4
    t: 8640
- term: ACE mentality
  aliases:
  - ACE
  - ACE framework
  - ACE mindset
  - Coach Cupcake's ACE
  - Ace mentality
  - acknowledge the best play
  - communicate
  - embrace reality
  meaning: 'A framework for when your team isn''t aligned: Acknowledge the best play, Communicate it with
    pings and body language, and Embrace reality by accepting what your team actually does and picking
    your best response. It supports playing with intention and handling tilt.'
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 3331
  - episode_id: Jbw9Dq4GWUc
    t: 3355
  - episode_id: Jbw9Dq4GWUc
    t: 3385
  - episode_id: EgAO9qiKYm4
    t: 4558
  - episode_id: uZQvmLrUVKM
    t: 4190
- term: focus on the controllables
  aliases:
  - focus on what you can control
  - not being a victim
  - it's a choice to be a victim
  meaning: Put attention on your own play and decisions rather than teammates; when someone flames or
    ints, choose not to be a victim and play your best.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 3804
  - episode_id: ANlsvzO-fdc
    t: 3706
- term: getting 1% better every game
  aliases:
  - your own journey
  meaning: Treat each game as a step in your own journey, take as many learnings as you can and carry
    them forward whatever the result.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 3775
- term: you don't have the right to open chat
  aliases:
  - party chat on
  meaning: If you can't control your temper and are making game-losing errors, don't use all-chat; set
    chat to party-only.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 3862
- term: own the error / equal responsibility
  aliases:
  - foresight
  meaning: If you die to a bad jungler gank, you clicked the buttons, so you share responsibility and
    should have had the foresight to say no.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 3889
- term: graveyard of duoQ
  aliases:
  - online graveyard
  meaning: The view that many players duo queue constantly and never improve.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 3994
- term: rubber duck troubleshooting
  aliases:
  - rubber duck method
  meaning: Explaining a problem aloud to notice what you missed; applied to duoing by voicing map info
    and plans to your partner.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 4224
- term: training grips analogy
  aliases:
  - grips
  meaning: Like lifting grips, a stable top laner handling top-side macro removes a limiting variable
    so the jungler can train other parts of the game.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 4355
- term: soft coaching
  aliases: []
  meaning: A more experienced player (e.g. duo partner) informally fills gaps in a newer player's knowledge.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 4452
- term: diminishing returns on duoQ
  aliases:
  - duo diminishing returns
  meaning: Duoing helps new players a lot but its value drops around Platinum/Emerald and above, where
    you must solve puzzles yourself.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 4478
- term: duoQ as a bandaid for the mental stack
  aliases: []
  meaning: A duo partner's information covers a weak mental stack but doesn't develop yours, and you may
    take it as gospel.
  sources:
  - episode_id: G1A0U5bJRZM
    t: 1821
- term: spoon-fed
  aliases:
  - getting spoon fed information
  meaning: Receiving answers from a partner without working them out; it speeds learning but leaves gaps
    and covers one perspective.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 4569
- term: mental blocks
  aliases:
  - champion mental blocks
  - community sentiment
  meaning: Beliefs about a champion (broken, no counterplay, must win early) that make you play worse
    against or with it, feeding narratives stronger than its stats.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 5072
  - episode_id: 2WQ8zHtK6fc
    t: 3775
- term: core mage
  aliases:
  - pepper in other champions
  - branching out archetypally
  meaning: Pick one main mage as foundation, then add a few champions from other archetypes to fill gaps,
    starting around mid-gold.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 5355
- term: Mottism
  aliases:
  - Morganism
  - Pinglish
  meaning: A joking name for the hosts' in-group jargon and coined terms listeners may not follow.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 5520
- term: process
  aliases:
  - the BBC process
  - three-block process
  meaning: An intentional way of conducting your League learning, knowing what you're testing, how many
    games and reviews you do, so League becomes a vessel for improvement. It can be tailored but must
    be deliberate.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 282
  - episode_id: 2WQ8zHtK6fc
    t: 3409
- term: dials
  aliases:
  - dials on a wall
  meaning: The adjustable variables of your process (games per day, review length, days per week) tuned
    to your schedule and energy.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 311
- term: fake process
  aliases:
  - optical process
  meaning: Going through the steps of the process without real engagement, intensity, or curiosity, so
    it looks right but gives no learning.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 398
- term: toxic fake process
  aliases:
  - following the process to prove it doesn't work
  meaning: Deliberately following the process hollowly so you can claim it failed and blame the system.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 520
- term: three block
  aliases:
  - 3 block
  - 3 blocking
  - three blocking
  - three block system
  - three block method
  - three block process
  - three block-a-roo
  - block
  - blocks
  - the block process
  - two block
  - 0-3 block
  meaning: 'The hosts'' signature structure: play a block of about three focused games (sometimes two
    or four) with high intensity, then stop regardless of results. It prevents tilt queuing and marathon
    sessions, and reviews can be slotted after each game, after the block, or before the next block.'
  sources:
  - episode_id: ANlsvzO-fdc
    t: 658
  - episode_id: ANlsvzO-fdc
    t: 4106
  - episode_id: 2WQ8zHtK6fc
    t: 514
  - episode_id: 2WQ8zHtK6fc
    t: 663
  - episode_id: 2WQ8zHtK6fc
    t: 4698
  - episode_id: EgAO9qiKYm4
    t: 9433
  - episode_id: uZQvmLrUVKM
    t: 1605
  - episode_id: rWp2ZO2zHy4
    t: 198
  - episode_id: rWp2ZO2zHy4
    t: 669
- term: relationship with the game
  aliases:
  - healthy relationship with League
  - unhealthy relationship with league
  - healthy relationship with the game
  - relationship with League of Legends
  meaning: 'How intentionally and healthily you approach League: playing with intensity and respect for
    its difficulty without it harming your life. A healthy one is calm, process-driven and under your
    control; an unhealthy one involves addiction, ego, attachment to results or treating ranked like a
    casino.'
  sources:
  - episode_id: ANlsvzO-fdc
    t: 794
  - episode_id: 2WQ8zHtK6fc
    t: 3590
  - episode_id: 2WQ8zHtK6fc
    t: 3660
  - episode_id: EgAO9qiKYm4
    t: 10964
  - episode_id: uZQvmLrUVKM
    t: 508
  - episode_id: uZQvmLrUVKM
    t: 1385
- term: end of review
  aliases:
  - EOR
  - end of review mistake
  - end of review moment
  - end of review process
  meaning: The decisive mistake or missed opportunity that pushes the game into a harder alternate reality,
    so there's little point reviewing past it. It's a mindset for players and a tool for coaches to find
    the one or two pivotal moments, and the game isn't necessarily lost afterward.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 974
  - episode_id: ANlsvzO-fdc
    t: 1240
  - episode_id: EgAO9qiKYm4
    t: 11075
- term: alternate reality
  aliases:
  - alternative universe
  - different universe
  - decision tree
  meaning: The harder, less structured game state after a major error where you have fewer options; also
    the imagined timeline where you made the right play.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 1066
- term: snowball nature of League
  aliases:
  - respect the snowball
  meaning: Early advantages and mistakes compound, so you can't play the early game averagely and expect
    to make up for it later.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 1027
- term: capitalizing on enemies mistakes mindset
  aliases: []
  meaning: After an end of review mistake, accept the game is now dictated by enemy errors and keep playing
    to win.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 1308
- term: learning objective
  aliases:
  - learning objectives
  - learn objective
  - major learning objective
  - in-game learning objectives vs post-game
  meaning: A specific thing you deliberately focus on improving, in or out of game, to narrow attention
    (e.g. jungle tracking, looking at lanes). Because in-game objectives tax the mental stack, they're
    mostly set for post-game.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 1441
  - episode_id: rWp2ZO2zHy4
    t: 369
  - episode_id: rWp2ZO2zHy4
    t: 1380
  - episode_id: G1A0U5bJRZM
    t: 2264
- term: in-game learning objective
  aliases:
  - in game learning objectives
  meaning: A learning objective focused on while playing; since it taxes mental stack you typically set
    only one, more carefully for laners than junglers.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 1483
- term: out of game learning objective
  aliases:
  - outer game
  - out-of-game learning objective
  meaning: A learning objective worked on in review rather than during play; it doesn't tax mental stack
    so you can set two or three.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 1540
- term: never go from learning objective to learning objective
  aliases:
  - default back to fundamentals
  - revisit the basics
  meaning: After an objective becomes muscle memory, return to refining basic fundamentals before taking
    another specific objective, since stacking them overwhelms the mental stack.
  sources:
  - episode_id: rWp2ZO2zHy4
    t: 1608
- term: first eight minutes learning objective
  aliases:
  - not dying in the first 8 minutes
  meaning: A default fundamentals objective covering warding, leaning, basic jungle tracking, threat assessment,
    dragon, and not dying early.
  sources:
  - episode_id: rWp2ZO2zHy4
    t: 1665
- term: champion pool cycling
  aliases:
  - champ pool cycling
  - champion cycling
  - champ cycling
  meaning: Keep a small pool of 2-4 champions and swap one in and one out at a time, avoiding burnout
    and big LP losses while staying fresh.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 1729
  - episode_id: EgAO9qiKYm4
    t: 785
- term: champ hopping rule (30 to 45 games)
  aliases:
  - healthy champ hopping
  meaning: Give each new champion roughly 30-45 games before judging it; bailing constantly is a red flag.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 1848
- term: BBC pyramid
  aliases:
  - stage 1-4
  - Stage 1, 2, 3, 4 model
  - four stages of improving at League of Legends
  - the pyramid
  - stages
  - stages (the pyramid)
  - pyramid of success
  - BBC pyramid scheme
  - four stages pyramid
  meaning: 'The hosts'' four-stage pyramid for categorizing mistakes: stage 4 (mindset/out-of-game) at
    the base, stage 3 (identity, win condition, role), stage 2 (decision making) and stage 1 (mechanical
    execution) on top. You review from the base up, and lower stages take precedence; stage 1 is a tiny
    capstone.'
  sources:
  - episode_id: ANlsvzO-fdc
    t: 1387
  - episode_id: 1AO2iZwUt9s
    t: 85
  - episode_id: 1AO2iZwUt9s
