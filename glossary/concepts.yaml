  - episode_id: uZQvmLrUVKM
    t: 5425
- term: stage four issues
  aliases:
  - stage four
  - stage 4
  - stage 4 issues
  - stateful issues
  - out of game problems
  - relationship with the game (stage 4)
  - living in stage four
  meaning: 'The base of the pyramid: out-of-game problems and mindset (sleep, tilt, narratives, LP fixation,
    ranked anxiety, expectations, bad relationship with the game) that undermine everything above. Until
    they''re addressed there''s no point reviewing in-game details; they are the only legitimate source
    of inconsistency.'
  sources:
  - episode_id: ANlsvzO-fdc
    t: 3447
  - episode_id: 2WQ8zHtK6fc
    t: 1569
  - episode_id: 2WQ8zHtK6fc
