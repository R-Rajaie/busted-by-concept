- term: cheese
  aliases:
  - cheese builds
  meaning: Cheese is a gimmicky shortcut, such as an early jungle invade or an unusual build, that wins
    games or climbs rank quickly without building real fundamentals. The hosts call it an \"easier cheat
    code\" and a band-aid solution. It is unsustainable, because League \"will hit you like a ton of bricks
    eventually\" and the climb stops working at higher ranks. They contrast it with a structured, consistent,
    long-term approach. They also say a champion can have \"a cheese attached\", meaning a trick that
    can win games, and Ziggs has none.
  sources:
