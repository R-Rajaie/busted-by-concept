  - episode_id: uZQvmLrUVKM
    t: 0
  - episode_id: uZQvmLrUVKM
    t: 5425
  reviewed: suggested
- term: stage four issues
  aliases:
  - stage four
  - stage 4
  - stage 4 issues
  - out of game problems
  meaning: 'Stage 4 is the bottom of the BBC pyramid: out-of-game problems that stop you from expressing
    your best self, such as too little sleep, tilt from previous blocks, comparing yourself to friends,
    narratives about the game or teammates, champion mental blocks, LP fixation, ranked anxiety, toxic
    expectations, and a bad relationship with the game (a common cause and example, not a synonym). Curtis''s
    rule is that there''s no point getting into in-game details or the micro until these are addressed,
    since the same player with a clear mind wouldn''t make those mistakes. They are also the main real
    source of off-days versus on-days.'
  sources:
  - episode_id: ANlsvzO-fdc
    t: 3447
  - episode_id: 2WQ8zHtK6fc
    t: 1569
  - episode_id: 2WQ8zHtK6fc
    t: 3747
