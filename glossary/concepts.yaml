    t: 5588
- term: stage one
  aliases:
  - stage 1
  - top of the pyramid
  - execution stage
  meaning: 'Pure mechanical execution: you know the right call and attention but fumble the input (missed
    skillshot, bad flash). A small cherry on top that rarely is the real problem.'
  sources:
  - episode_id: 1AO2iZwUt9s
    t: 1456
  - episode_id: uZQvmLrUVKM
    t: 4647
  - episode_id: uZQvmLrUVKM
    t: 5284
- term: stage one goblins
  aliases: []
  meaning: A joking label the hosts use for players whose personality leads them to fixate on stage one
    of the pyramid (the pyramid of stages they use to think about the game). They give 'stage two goblins'
    as a parallel label for stage two, and mention people who live permanently in stage four, who mainly
    want to talk about out-of-game issues. The passage doesn't say what stage one contains.
  sources:
  - episode_id: uZQvmLrUVKM
    t: 5688
  reviewed: suggested
- term: cycling through the stages
  aliases: []
  meaning: The hosts mean that players don't climb the pyramid once and finish. At different points they
    have to revisit different stages as they improve, e.g. champion mastery (stage 3), then mental stack
    (stage 2), then dialing in stage 1, then possibly stage 4 again, and so on. Even top players, like
    Challenger Ekko players with a wrong view of the champion, sometimes have to go back to an earlier
    stage such as stage 3.
  sources:
  - episode_id: uZQvmLrUVKM
    t: 5558
  reviewed: suggested
- term: 1-3-1
  aliases:
  - 1-3-1 lane assignment
  meaning: Mid-game assignment of one top, three mid, one bot; risky and mostly competitive, usable temporarily
    before a 1-4.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 2597
- term: 1-4
  aliases:
  - 4-1
  - 4-1ing
  meaning: Mid-game assignment with one player in a lane and four grouped on another to siege; more consistent
    in solo queue, best as one mid and four on a side.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 2645
- term: get into the details
  aliases:
  - getting specific
  - get specific
  meaning: 'A mindset first and a behaviour second: when you''re confused or ask a vague question, you
    stop talking in general terms and look at what actually happened in the specific case, for example
    by pulling up the VOD or op.gg. You name exactly what you did (which Qs, which positioning, which
    summoner spell use) instead of \"I played badly\". The hosts push this because there are no generic
    checklists or shortcuts, so advice has to be case by case. In one mailbag answer, they add asking
    whether it''s reasonable to expect that fix of yourself at your stage.'
  sources:
  - episode_id: ANlsvzO-fdc
    t: 2199
  - episode_id: EgAO9qiKYm4
    t: 11435
  - episode_id: 2WQ8zHtK6fc
    t: 5135
  reviewed: suggested
- term: broken by concept
  aliases:
  - BBC
  meaning: Something whose sheer existence is so overpowered that number tuning can't fix it. Nathan coined
    it over movement speed quintessences; now also a loose phrase for anything absurdly good.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 2809
  - episode_id: EgAO9qiKYm4
    t: 8489
  - episode_id: EgAO9qiKYm4
    t: 8531
- term: inconsistency (doesn't exist)
  aliases:
  - inconsistent
  meaning: The hosts argue that 'inconsistency' isn't real for almost all players. Your level of play
    isn't swinging. Each game gives you different puzzles, so you win the ones your known concepts cover
    and lose the ones they don't. Real consistency only becomes a topic once you've mastered nearly every
    concept, at the highest levels. Below that, treat each loss as a sign you made a specific mistake.
    Review your deaths, find it, and fix it.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 3062
  reviewed: suggested
- term: League as a thousand concepts
  aliases: []
  meaning: The hosts ask you to imagine League as made up of about a thousand concepts, each with a theory
    part and an execution part. An Iron player understands only some of them (say 50), and not the same
    50 as other Iron players. That explains why the same level of play wins some games and loses others.
    It isn't inconsistency, because the opponent or matchup may test a concept you lack. The job is to
    use every game, win or loss, to learn new concepts and get better at executing them.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 3201
  reviewed: suggested
- term: logical mindset about toxic players
  aliases:
  - empathy for them
  - not going down to their level
  meaning: Treat a flamer as at an earlier stage of development, feel pity not anger, and keep following
    your own process.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 3762
- term: solo queue as a mental quest
  aliases:
  - mental quest
  meaning: 'When a teammate is toxic or inting, such as a support who ganks top from level 1 and never
    returns, don''t go down to their level. Ignore them, pretend they don''t exist, and play your own
    game as well as you can. Curtis frames this as a ''quest'' or ''minigame'': problem-solve the game
    with a level 2 mid gank, creative resets and XP sapping, and try to win against the odds. He also
    frames it as a ''mental quest'', which is you versus yourself, developing stoicism, mental fortitude
    and emotional regulation while the flamers stagnate.'
  sources:
  - episode_id: ANlsvzO-fdc
    t: 3959
  reviewed: suggested
- term: pretend they don't exist
  aliases: []
  meaning: When a teammate or opponent is flaming or inting to provoke you, refuse to engage or take it
    personally and act as if they aren't there (muting is just one aid). Don't go down to their level
    or give them the reaction they want. Put your energy into playing your own game as well as you can,
    even treating it as a mental quest or minigame to win against the odds.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 3924
  reviewed: suggested
- term: losses as indicators
  aliases:
  - losses are indicators that you need to change your behavior
  meaning: Treat losses as signals your behavior needs to change rather than blaming external factors.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 4561
- term: frustration is not understanding
  aliases:
  - frustration comes from confusion
  - game is a puzzle
  meaning: Frustration and tilt mainly come from confusion; frustrating situations are puzzles you haven't
    learned to solve.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 4480
- term: mood player
  aliases: []
  meaning: A self-label for a player whose emotions dictate decisions; it builds a fixed identity, so
    instead identify the specific frustration.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 4452
- term: lead by example
  aliases: []
  meaning: 'Leading by example means earning the authority to change a friend''s or teammate''s behavior
    by visibly being more competent, for example by climbing high in SoloQ, because people who don''t
    recognize your level won''t take criticism. The hosts pair it with a separate point: improve individually
    on your own, and treat team games as the place to express that level, not to improve.'
  sources:
  - episode_id: ANlsvzO-fdc
    t: 4829
  - episode_id: ANlsvzO-fdc
    t: 4978
  reviewed: suggested
- term: tackle issues in isolation
  aliases:
  - solve them one by one
  meaning: Treat each problem (mood, caffeine, champion pool) as a separate issue and fix them one at
    a time.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 4646
- term: sandwich technique
  aliases:
  - shit sandwich
  meaning: Give teammates criticism wrapped between praise and encouragement.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 4930
- term: accountability
  aliases:
  - taking responsibility
  meaning: Owning your own input in specific moments of a game, not blaming yourself for the result; the
    cornerstone of good learning, though taking too much is also an error.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 260
- term: threat assessment
  aliases: []
  meaning: Threat assessment is one skill within real champion mastery. It means reading a situation to
    know when you can go forward, when you can kill someone, and what trades you can take. The hosts say
    this one skill scales indefinitely. They tie it to knowing your limits, and they note that high-level
    players can judge free kills to within about 10-20 damage.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 1006
  reviewed: suggested
- term: detaching from LP
  aliases:
  - focusing on the learning over the LP
  meaning: Treat LP as a byproduct and measure of your level, valuing each game by what you learned; detach
    from gaining as well as losing it.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 1108
- term: every game is the least important game and the most important game
  aliases: []
  meaning: No single game matters much on its own, but each counts as part of your long-term journey.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 1249
- term: League Enlightenment
  aliases:
  - League of Legends nirvana
  meaning: Being detached from LP and focused on process, usually reached only after feeling LP's sting.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 1284
- term: expectations
  aliases:
  - toxic expectations
  - unreasonable expectations
  - healthy vs unhealthy expectations
  meaning: The number one source of tilt and stage four issues when they concern things outside your control
    (teammates, matchmaking, deadlines); expectations tied to your own standards are fine.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 1399
  - episode_id: uZQvmLrUVKM
    t: 1168
- term: the word "should"
  aliases: []
  meaning: 'Warning sign of unreasonable expectations: saying ''they should have'' means you aren''t adapting
    to reality.'
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 1627
- term: adaption and embracing reality
  aliases:
  - the chaotic nature of SoloQ and your ability to adapt to it
  meaning: Accept how SoloQ actually plays out and adapt with open-mindedness instead of 'should' thinking.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 1643
- term: fighting
  aliases: []
  meaning: Fighting is the ability to actually win teamfights and skirmishes (\"click the buttons\"),
    which the hosts call a basic requirement, since you must win fights to kill the Nexus, however good
    your macro knowledge is. Many players underrate it because they focus on macro theory like rotations
    and priority. Fighting content was historically less emphasized because macro had larger gaps to fix
    first.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 1691
  reviewed: suggested
- term: out fight bad macro
  aliases:
  - you can out fight your way out of bad macro but you can't out macro your way out of bad fighting
  meaning: Strong fighting can cover poor macro but good macro can't cover poor fighting.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 1938
- term: growth mindset
  aliases: []
  meaning: The belief that you can learn, change and improve through effort, time and practice, rather
    than being capped by talent. Challenges are seen as positives to overcome, and every game is a chance
    to get a bit better and to learn how to learn. It is the opposite of a fixed mindset, which the hosts
    treat as a separate concept.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 2032
  - episode_id: 2WQ8zHtK6fc
    t: 4931
  - episode_id: EgAO9qiKYm4
    t: 8893
  - episode_id: EgAO9qiKYm4
    t: 8982
  - episode_id: uZQvmLrUVKM
    t: 387
  reviewed: suggested
- term: joy
  aliases:
  - fun
  meaning: Enjoying League as a hobby, not a second job; without it you won't be curious or play with
    intensity.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 2430
- term: community
  aliases:
  - sharing your journey
  meaning: Sharing your climb with others to celebrate wins and make the lonely SoloQ journey feel shared.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 2489
- term: kindness
  aliases:
  - being kind to yourself
  - self-love
  meaning: Being kind to yourself, giving breathing room after mistakes and counting process wins.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 2594
- term: long-term thinking
  aliases: []
  meaning: 'Viewing your League journey in months (e.g. six months out) rather than individual games,
    blocks or days, so you build skills through a steady process instead of clawing for quick LP or a
    few fast wins. The hosts liken it to a marathon, not a sprint: progress takes time, and most people
    quit or keep changing things before results show.'
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 2762
  reviewed: suggested
- term: execution
  aliases:
  - League is a game of execution
  meaning: 'Execution is being able to apply the knowledge you already have, consistently, in the game.
    The hosts tie it to the mental stack: reps on the Rift build the habits so that wave management, resets,
    objectives, and landing spells take less energy. It is hard because you can forget one small thing,
    such as an ability, a summoner spell, or an item like Zhonya''s. The hosts criticize "disrespect for
    the execution": glossing over your own failed skill shots and blaming a teammate (for example your
    ADC) instead of owning the misses.'
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 3098
  - episode_id: 1AO2iZwUt9s
    t: 1702
  reviewed: suggested
- term: signal versus noise
  aliases:
  - noise
  - signal
  meaning: Noise is conflicting opinions and low-value information (YouTube, meta, chat, niche scenarios)
    to cut out; signal is the useful high-value learnings and the key info to read on the map.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 3157
  - episode_id: 2WQ8zHtK6fc
    t: 3231
  - episode_id: G1A0U5bJRZM
    t: 679
- term: writing a thesis on their game
  aliases: []
  meaning: Reviewing every little decision instead of prioritizing; it doesn't work.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 3247
- term: open-minded
  aliases:
  - open-mindedness
  meaning: Being open to all possibilities and willing to change your opinion. When a read or hypothesis
    (for example a win-condition assessment or how bot lane should play out) turns out wrong, you consider
    that you may have been off instead of blaming a teammate ('that player sucks'). You then adjust, for
    example by shifting the win con or accepting unexpected player tendencies. The hosts say it is very
    closely linked to adaptation.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 3275
  reviewed: suggested
- term: thousands of miniature hypotheses
  aliases: []
  meaning: The hosts' framing, in the context of being open-minded, that during a League game you are
    constantly forming thousands of small predictions or reads, such as how bot lane will play out or
    what your win condition is, and reality either bears them out or doesn't. When one is proven wrong,
    a closed-minded player blames others ('that was their fault, it should have played out this way').
    An open-minded player admits their assessment may have been off, takes the lesson, and adapts.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 3328
  reviewed: suggested
- term: quality versus quantity
  aliases:
  - Goldilocks zone
  meaning: Improvement needs enough reps but not so many that quality drops; find the zone of games you
    can play at high intensity.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 3479
- term: League as a hobby
  aliases:
  - accepting where League is in your life
  meaning: Accept League as a meaningful hobby, not your whole life or a big event.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 3860
- term: man in the arena
  aliases:
  - theory versus practice
  - get in the arena
  meaning: 'From Theodore Roosevelt''s ''man in the arena'' quote: credit goes to the person who actually
    plays and risks error, not the critic or theorist. The hosts use it to say you should get on the Rift
    and get messy instead of only watching coaching content or guides, because every game at every Elo
    is chaotic and you can''t theory your way out of it. They respect a player who stumbles but does so
    with intention.'
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 3886
  reviewed: suggested
- term: tough conversation with yourself
  aliases:
  - the conversation you have with yourself
  meaning: Honestly questioning why you throw games or avoid review; unpleasant but leads to growth.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 4022
- term: utopia
  aliases:
  - solo queue utopia
  meaning: The unrealistic wish for a perfect, easy solo queue with good teammates.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 4073
- term: VOD review
  aliases:
  - VOD reviewing
  meaning: Reviewing your own games to find what to do better; a real skill that takes time.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 4231
- term: quick VOD review
  aliases:
  - don't over review
  meaning: Use your feelings to jump to bad points, take one or two learnings and leave; improve through
    many quick reps.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 4349
- term: X Factor
  aliases:
  - X-Factor
  meaning: An edge or unconventional creativity that lets you exceed expectations, mostly relevant at
    higher Elo.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 4412
- term: Zoom out
  aliases:
  - zooming out
  meaning: Zooming out means stepping back from your own narrow view to get perspective. In game, that
    means not seeing yourself as the main character (you're one champion on the rift) and viewing the
    game through other people's lenses, like your jungler's, to build mid-game macro. Over the longer
    run, it means treating a single game, block or decision as one small part of your journey (a 0-3 block
    is just a block), taking a few learnings and moving on.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 4639
  reviewed: suggested
- term: soloq journey
  aliases:
  - your journey
  meaning: Each player's climb is unique, so don't compare yourself to others.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 4544
- term: know your why
  aliases:
  - your why
  - knowing your why
  - accepting your player identity
  - aligned with your why
  meaning: Having a clear personal reason for playing; stage four issues develop when your actions contradict
    it.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 4364
  - episode_id: uZQvmLrUVKM
    t: 1527
- term: identity level versus behaviour level
  aliases:
  - changing your language
  meaning: Judge specific actions ('my Q's were filthy') rather than yourself as a person, detaching self-worth
    from rank.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 4832
  - episode_id: 2WQ8zHtK6fc
    t: 5185
- term: insecurity
  aliases: []
  meaning: A sign you aren't accepting your actual capacity, stemming from caring about others' opinions
    and a fixed mindset.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 4910
- term: perfectionism and elitism
  aliases:
  - high standards
  meaning: Holding very high standards without a process; unsustainable. Fix by getting specific.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 4977
- term: tempo
  aliases:
  - ahead in tempo
  - behind in tempo
  meaning: Tempo is the relative time advantage between a player and their opponent. Being ahead in tempo
    means you finished a mandatory task first (clearing a wave, resetting, finishing camps), so you are
    on the map and able to attend plays before they can. Being behind means you are slower to finish and
    so slower, or unable, to attend plays. It can also describe a whole team's time advantage, for example
    when everyone is back on the map before the enemy respawns.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 1004
  reviewed: suggested
- term: tempo reset
  aliases:
  - tempo base
  meaning: Recalling while ahead in tempo so it's free and the opponent can't punish.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 1217
- term: priority
  aliases:
  - prio
  - do you have move
  meaning: Ability to move to a play first, usually via wave push; fleeting.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 1477
- term: fake prio
  aliases: []
  meaning: A lane that looks like it has priority but doesn't (opponent full resources, pusher low mana
    or needs to base).
  sources:
  - episode_id: EgAO9qiKYm4
    t: 1612
- term: quality of priority
  aliases:
  - hard prio
  - soft prio
  meaning: Hard prio is a fresh fully pushed wave or a low opponent; soft prio is a late push with the
    next wave close.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 1639
- term: fundamentals
  aliases:
  - respecting the fundamentals
  - the basics
  meaning: Core game concepts that give consistent play regardless of champion (resets, trading, warding,
    looking at lanes, jungle tracking, threat assessment). The highest-level players keep respecting them.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 1698
  - episode_id: EgAO9qiKYm4
    t: 1829
  - episode_id: rWp2ZO2zHy4
    t: 1745
- term: mental stack allocation
  aliases:
  - moving your mental stack around
  - allocating your energy
  - where to direct attention
  - directing energy within the mental stack
  meaning: Intentionally choosing which information to prioritize in your limited mental stack for the
    matchup and game state, and directing attention to what wins games rather than what doesn't matter.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 2270
  - episode_id: G1A0U5bJRZM
    t: 2060
  - episode_id: G1A0U5bJRZM
    t: 2569
- term: playing slow
  aliases: []
  meaning: Conserving resources, trading less and focusing on survival, farming and info, used when behind.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 2490
- term: playing fast
  aliases: []
  meaning: Trading often and creating chaos when you have an advantage; can overwhelm the enemy's mental
    stack.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 2504
- term: sync pressure
  aliases:
  - synchronized pressure
  meaning: Applying pressure on the map at the same time as teammates; if your team is in base, don't
    make solo plays. The macro-scale version of multi-threat.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 3502
  - episode_id: EgAO9qiKYm4
    t: 6392
- term: hovering
  aliases:
  - hover
  - complimenting your jungler
  - shadowing
  - hover your jungler
  meaning: Preemptively placing yourself near a teammate or jungler because you anticipate action, usually
    in fog of war, to assist with their path; unrelated to praise.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 3658
  - episode_id: EgAO9qiKYm4
    t: 6392
- term: shove and hover
  aliases: []
  meaning: Push the wave then stand in fog of war so the enemy plays as if you might commit; common for
    mids and ADCs after ~8 minutes.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 3725
- term: laner psychology
  aliases: []
  meaning: Using reads on how teammates and enemies behave to decide where to hover.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 3886
- term: numbers advantage
  aliases:
  - man advantage
  - man advantage mindset
  meaning: Having more available teammates to respond to a play; a mindset of constantly creating fleeting
    numbers advantages.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 3914
- term: overloading
  aliases:
  - overloading a side lane
  meaning: Creating a numbers advantage in one area by sacrificing something elsewhere; more advanced.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 4149
- term: map split
  aliases:
  - split the map
  - trading sides of the map
  meaning: Each team has most players on opposite sides of the map; common when trading neutrals and rarely
    lasts over 3-4 minutes.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 4880
- term: cross map
  aliases:
  - cross mapping
  - cross map play
  meaning: Making a play on the opposite side from the enemy, e.g. conceding an objective, without matching
    every play.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 5072
- term: threat
  aliases:
  - imposing threat
  - potential
  - capacity
  meaning: A champion's capacity to kill or punish; it occupies the enemy's mental stack and limits their
    options even if nothing happens.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 6034
  - episode_id: EgAO9qiKYm4
    t: 6182
- term: multi-threat
  aliases: []
  meaning: Multiple champions present in a fight so the enemy must consider everyone, spreading their
    CC and damage.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 6294
- term: limit testing
  aliases:
  - limit test
  meaning: Intentionally making a play without knowing the outcome to learn a champion's capabilities,
    with a scientist mindset.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 6472
- term: transition periods
  aliases:
  - transition period
  meaning: Moments between major events when the next play is organized (after a dragon fight), where
    speed matters.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 6576
- term: eras
  aliases:
  - entering a different era
  meaning: Viewing the game as phases with one big thing to prepare for; when it's gone, work out the
    next.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 6697
- term: compensation
  aliases:
  - compensation play
  meaning: Committing to a play you know is wrong because of external pressure; unlike limit testing it
    stifles learning.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 6727
- term: heavy trade
  aliases:
  - heavy trading
  meaning: Dealing a lot of damage in one trade while disregarding your HP, expecting to leverage it;
    injects volatility.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 6929
- term: 100 to 0 trade
  aliases:
  - one-way trade
  - one-sided trade
  meaning: 'A lane-phase trade where you deal damage to the enemy and take none in return. It doesn''t
    mean a solo kill: you are the 0 and they are the 100. It isn''t only poke, because melee champions
    can do it too (Renekton going in and out, Garen with shield), and the hosts use it as a mindset ("I
    don''t want you taking damage"). It''s about laning, not chunking someone in the jungle or picking
    them off.'
  sources:
  - episode_id: EgAO9qiKYm4
    t: 7033
  reviewed: revised
- term: short trade
  aliases:
  - short trades
  - short trading
  meaning: A swift small burst (~10% HP) with cooldowns up, then exit combat; the opposite of long extended
    trades.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 7166
  - episode_id: EgAO9qiKYm4
    t: 7320
- term: long trade
  aliases:
  - extended trade
  - long extended trades
  - extended trades
  meaning: A trade that stays in combat for an extended period, often through multiple ability rotations,
    suiting low-cooldown champions.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 7279
  - episode_id: EgAO9qiKYm4
    t: 7349
- term: trades as mindset reference points
  aliases:
  - reference points in a lane phase
  meaning: Trade types are mostly ways of thinking about a champion's lane approach.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 7249
- term: war of attrition
  aliases: []
  meaning: Out-sustaining the enemy in HP or mana instead of killing them.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 7372
- term: ping pong waves
  aliases:
  - ping ponging waves
  meaning: Neither laner interacts and the wave bounces between towers; favors the scaling champion.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 7525
- term: lane control
  aliases: []
  meaning: One player dictating the wave state; precursor to priority.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 7611
- term: make them react
  aliases:
  - make the enemy react
  - making them react
  meaning: Pushing a wave (pinning the enemy to it) so they have to respond, either by giving up the wave
    or by catching it, and using the time they spend responding to create a temporary numbers advantage,
    start a neutral objective or fight, or reset. The hosts treat it as a mindset as well as an action,
    meant to avoid coin-flip fights. What you do next sets the style. Shove and move means leaving to
    play elsewhere, while a split pusher or a tank like Illaoi stays and makes several enemies come to
    the side lane.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 7773
  - episode_id: EgAO9qiKYm4
    t: 7969
  - episode_id: 2WQ8zHtK6fc
    t: 1789
  reviewed: suggested
- term: shove and move
  aliases:
  - shoving and moving
  meaning: Clear the wave to make the enemy react, then leave to move around the map.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 7828
- term: playing through mid
  aliases:
  - mid first
  - play through mid
  meaning: Push the mid wave and pin the enemy, then use their reaction time to move around the map.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 7940
- term: overstaying
  aliases:
  - overstay
  meaning: Staying active on the map after a major play, desyncing from your team.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 8106
- term: piss banger
  aliases:
  - piss banger mindset
  meaning: A late-game solo queue slog where both teams throw; as a mindset, stay loose and never give
    up.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 8345
- term: capital injection
  aliases: []
  meaning: Saying no to a play and instead splitting to take waves, camps and towers for a large amount
    of gold.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 9078
  - episode_id: EgAO9qiKYm4
    t: 9116
- term: improvement by subtraction
  aliases: []
  meaning: Getting better by removing mistakes and complexity before adding new concepts.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 9593
- term: raising your floor
  aliases:
  - increasing the bottom end of your LP bell curve
  - raising your skill floor
  meaning: Improving your worst games and baseline rather than your peak.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 9642
- term: reps
  aliases:
  - repetitions
  - intentional repetitions
  meaning: Repeated actions of intentional practice; seeing more situations while paying attention makes
    them non-novel and lowers mental stack load. You can't shortcut it.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 9642
  - episode_id: G1A0U5bJRZM
    t: 1900
- term: saying no
  aliases:
  - learning to say no
  meaning: Refusing a teammate's objectively bad call, ideally with an alternative.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 9806
- term: towards statements vs away from statements
  aliases:
  - away from statements
  meaning: Comms telling teammates what to do ('towards') work better than 'don't' statements ('away from').
  sources:
  - episode_id: EgAO9qiKYm4
    t: 9944
- term: narratives
  aliases:
  - narrative
  - narratives of beliefs
  meaning: Stories players tell themselves ('loser's queue') to appease the ego; they become excuses that
    block learning.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 10036
  - episode_id: uZQvmLrUVKM
    t: 607
- term: self-sabotage
  aliases: []
  meaning: Actively making poor choices that lower your chance of winning, usually driven by a poor mental
    state and ego-protecting mechanisms. It can happen in game (e.g. flaming or subtly toxic pinging that
    makes teammates play worse) or before it, such as queuing at the wrong time like a fifth game of the
    block after going 0-4. The hosts say reducing it matters as much as improving, because it is built
    into your rank.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 10281
  - episode_id: EgAO9qiKYm4
    t: 10334
  reviewed: suggested
- term: having a crack
  aliases:
  - have a crack
  - have a go
  meaning: Trying your best without attachment to the result; the antidote to perfectionism.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 10412
- term: put your body in the area
  aliases:
  - putting a body in an area
  - put bodies in an area
  meaning: Physically being in a space to control it so the enemy must respect you.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 10554
- term: rock bottom
  aliases:
  - hitting rock bottom
  meaning: Being comfortable losing LP drops perfectionism and expectations so you can focus on process.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 10661
- term: let them rot
  aliases:
  - LetThemRot
  meaning: Letting your team die in an unwinnable fight so you can do what's good for you; not flaming.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 11351
- term: make them sweat for LP
  aliases:
  - make them sweat
  meaning: When behind, make the game as hard as possible for the enemy without caring about winning,
    often winning anyway.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 11533
  - episode_id: EgAO9qiKYm4
    t: 11578
- term: LP bell curve
  aliases:
  - bell curve
  meaning: The range your LP fluctuates around baseline; a wide curve suggests a process problem.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 11628
- term: plateau
  aliases:
  - the plateau
  meaning: Period of no climbing; where you must change something and do the learning.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 11794
- term: accepting your level of play
  aliases:
  - accepting your current level
  meaning: Acknowledging that your current rank accurately reflects your level and adopting a growth mindset,
    instead of thinking you deserve a higher rank. The hosts say the 'I deserve to be higher' mindset
    comes from ego and comparison and makes you less focused, more judgmental of others, more insecure
    and quicker to make excuses, and it is a precursor to a fixed mindset.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 11896
  - episode_id: rWp2ZO2zHy4
    t: 2270
  - episode_id: uZQvmLrUVKM
    t: 1470
  reviewed: suggested
- term: mental stack as two variables
  aliases:
  - mental stack formula
  meaning: The mental stack as the intersection of how many skills the game demands at once and your baseline
    proficiency at each.
  sources:
  - episode_id: G1A0U5bJRZM
    t: 131
- term: building subconscious / autopilot
  aliases:
  - bolstering the subconscious
  meaning: Building mastery and reps so routine tasks run automatically, freeing mental stack.
  sources:
  - episode_id: G1A0U5bJRZM
    t: 101
- term: focus as what you don't direct attention to
  aliases: []
  meaning: Focus is also what you don't attend to after allocating energy.
  sources:
  - episode_id: G1A0U5bJRZM
    t: 209
- term: overwhelming the mental stack
  aliases:
  - creating and breaking patterns
  - overloaded mental stack
  - overwhelmed mental stack
  - overloading their mental stack
  meaning: When too much demands attention, vision narrows and you can't track or decide well; you can
    do this to opponents by pressuring them or breaking patterns.
  sources:
  - episode_id: G1A0U5bJRZM
    t: 254
  - episode_id: G1A0U5bJRZM
    t: 1037
  - episode_id: G1A0U5bJRZM
    t: 1349
- term: mental stack destroyer
  aliases:
  - X-Factor champions
  meaning: A champion like Neeko that adds an extra variable to track, straining the mental stack.
  sources:
  - episode_id: G1A0U5bJRZM
    t: 278
- term: minigame champions
  aliases: []
  meaning: Champions who play so uniquely you must permanently set aside mental stack for them, like Evelynn
    after 6.
  sources:
  - episode_id: G1A0U5bJRZM
    t: 321
- term: priming the mental stack
  aliases:
  - priming a mental stack
  - mental stack priming
  - priming your mental stack
  - primed
