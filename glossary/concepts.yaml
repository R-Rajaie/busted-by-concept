  - episode_id: uZQvmLrUVKM
    t: 2794
  reviewed: suggested
- term: champion reference points
  aliases:
  - reference points
  - reference point
  - key reference points
  meaning: Champion reference points are practical, granular, champion-specific guiding principles based
    on the champion's inherent strengths and weaknesses. Examples are fight around your ult, recall on
    a certain item, and play off your ult cooldown. They act as walls around your gameplay, tell you what
    not to do, and give consistency and a resting point to return to when the game gets confusing. If
    champion identity is the why, reference points are the what. They are split into laning-phase and
    mid-game sets. They matter most while learning a champion, and high-mastery players can deliberately
    break them.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 1539
