- term: final domino
  aliases: []
  meaning: A mindset Charlie got from Johnny, one of the mentors at Botlane Academy (BLA), for when things
    around you are collapsing and you risk checking out or becoming emotionally incoherent. Picture your
    team as a chain of dominoes where every other one has fallen and you are the final one still upright.
    It's your job to stay upright and hold down the fort, because if one little breeze knocks you over,
    the whole chain is done and the game is over.
  sources:
  - episode_id: qMcLBCTFDtI
    t: 2115
  reviewed: revised
- term: carnivore ADC
  aliases:
  - carnivore hypercarry
  - carnivore ADC carries
  meaning: Dan's label for scaling ADCs that can't easily neutralize the wave and have to play to fight
    and trade in lane, such as Vayne, Twitch, Tristana and Aphelios. If they just last-hit and play passive,
    they get shoved in and bleed out and never reach their scaling. They need to look for good short trades
    and all-ins to relieve pressure. The opposite is the "herbivore" hypercarry, like Jinx or Sivir, which
    can play for the wave and neutralize more easily.
  sources:
  - episode_id: KMd1aeDcZmw
    t: 1649
  - episode_id: KMd1aeDcZmw
    t: 1950
- term: herbivore
  aliases:
  - herbivore jungle
  - herbivore jungler
  - herbivore hypercarry
  meaning: Herbivore describes a champion or player that farms and scales rather than fighting early.
    In the jungle (e.g. Karthus, or a full-clearing player like Malos) it means farming camps and minimizing
    your laners' deaths to slow the game's pace. For ADCs, herbivores like Jinx and Sivir can neutralize
    lane and play for the wave. The opposite is the \"carnivore\" hypercarry (Vayne, Twitch, Tristana,
    Aphelios), which must trade and fight early or it bleeds out and never scales. The hosts stress that
    a herbivore jungler still has a responsibility to the map. For example, they shouldn't blindly full
    clear when they can see a gank or dive coming that will kill a laner.
  sources:
