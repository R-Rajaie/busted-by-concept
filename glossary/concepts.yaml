- term: Mott's law
  aliases: []
  meaning: A tongue-in-cheek rule about not generalising from an exceptional player to the average one.
    If something works for a high-level player like Nathan or Charles, such as playing an off-pool champion
    or shrugging off spam pings with 'zero mental' impact, that doesn't make it good advice, because the
    average player doesn't get the same result. 'If I can do it, then it's all good' proves nothing, and
    the law is invoked to dismiss that reasoning.
  sources:
  - episode_id: CaxxF1sWFwM
    t: 1378
  - episode_id: 9rUbtBCanT0
    t: 7945
- term: tempo trap
  aliases:
  - getting tempo trapped
  - creating a tempo trap
  meaning: Punishing an opponent's reset or tempo by staying near them instead of backing with your team,
    so you catch them or block their recall and cost them farm, plates, or tempo. A player can "tempo
    trap" you in lane (for example, the enemy support stops your recall while you overstay for plates).
    You can also create one yourself, for example by pushing waves and setting up a trap somewhere after
    a small swing instead of forcing a risky fight. The hosts treat this as part of reading how enemy
    players behave, so you can play around it.
  sources:
  - episode_id: 71c133Qc6uI
    t: 1675
  - episode_id: 71c133Qc6uI
