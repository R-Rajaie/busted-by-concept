  reviewed: suggested
- term: disrespect
  aliases:
  - disrespecting the difficulty of the game
  meaning: 'Disrespecting the difficulty of the game means not respecting how hard League is. For example,
    people assume any champion is easy because it only has four abilities, and they miss the many levels
    of mastery. The hosts call this the root cause of toxic expectations: expecting more results than
    you are getting, then being humbled. Their remedy is to make peace with the difficulty and never think
    you are above the fundamentals, because League always humbles you. Disrespecting your opponents is
    a different thing. It is the "I''m better than everyone" ego mindset, where you assume you will dominate
    and can get away with disrespectful plays, as in the Mysterious/Jimmy example. The hosts also say
    the coaching craft is disrespected, both by the community treating it as an easy job anyone can do
    and by expecting quick results without years of work, as in the Ellis example.'
  sources:
  - episode_id: 3gh-AlQTF_Q
    t: 1357
