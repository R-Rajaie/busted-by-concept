  - episode_id: 1AO2iZwUt9s
    t: 665
  - episode_id: 1AO2iZwUt9s
    t: 1472
  - episode_id: uZQvmLrUVKM
    t: 359
  - episode_id: uZQvmLrUVKM
    t: 628
  - episode_id: uZQvmLrUVKM
    t: 1305
  - episode_id: uZQvmLrUVKM
    t: 1878
  - episode_id: uZQvmLrUVKM
    t: 5495
  reviewed: suggested
- term: stage three
  aliases:
  - stage 3
  - stage 3 issues
  - stage three issues
  - big picture thinking in game
  - big picture in game mindset issues
  meaning: Stage 3 is the in-game, big-picture mindset level of the pyramid. It covers how you think as
    your champion (champion identity and reference points), your role and win condition assessment, and
    your overall view of the game. Problems here mean you are acting through the wrong lens or don't know
    your role or win con, for example by perma-roaming for kills or feeling you must save every teammate.
    These are distinct from stage 2 decision-making in a specific game, stage 4 out-of-game issues, and
    stage 1 execution. The hosts say the community mostly misses it, because people judge individual decisions
    and ignore the mindset behind them.
  sources:
  - episode_id: 1AO2iZwUt9s
    t: 743
  - episode_id: 1AO2iZwUt9s
    t: 1372
  - episode_id: uZQvmLrUVKM
