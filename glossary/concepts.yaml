- term: herbivore
  aliases:
  - herbivore jungle
  - herbivore jungler
  - herbivore hypercarry
  - greedy/selfish jungler
  - full-clear jungler
  meaning: A champion or player style that plays passively for farm and scaling instead of fighting early.
    Herbivore junglers (Karthus, Master Yi-style full clearers, Gwen) full clear and minimize their laners'
    deaths to slow the game down, while herbivore hypercarries (Jinx, Sivir) can neutralize lane and play
    for the wave. The opposite is the "carnivore" champion (Vayne, Twitch, Tristana, Aphelios), which
    must trade and fight early or it bleeds out and never scales. The hosts warn that herbivore junglers
    still owe the map. They need to read when teammates will die, and when to leave camps for high-percentage
    counter-ganks, or they plateau around Diamond.
