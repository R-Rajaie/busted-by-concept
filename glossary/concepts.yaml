- term: weak side
  aliases:
  - weak-sided
  - 'weak-sided (verb: getting weak-sided)'
  meaning: 'Weak side is the side of the map, top or bot, where a team has a numbers disadvantage. It
    is decided mostly by where the jungler and support put their resources in early and mid game, so you
    can be weak-sided even while 3-0 if the jungler goes to the other lane and leaves you on an island.
    On weak side, recognize it and accept it. Don''t heavy trade, thin waves from a distance, ward defensively
    so you can''t be dove, and give up plates or a wave if needed. Lose gracefully, don''t die, and use
    the small windows you get to do something. Dying on weak side is judged by resources: dying lazily
    to a quick drive-by is a pretty bad mistake, and it matters more if you''re the carry with the resources.'
  sources:
