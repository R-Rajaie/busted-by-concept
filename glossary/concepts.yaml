  - episode_id: HTgR0NqKvxQ
    t: 3187
- term: leaning
  aliases:
  - warding and leaning
  - leaning to your ward
  meaning: A mid-lane fundamental where you ward one side of the lane and position yourself toward that
    warded side (\"lean toward your ward\"). It makes you harder to gank, but the hosts say its main value
    is offensive. The vision lets you posture aggressively and park further up the lane, which gives better-quality
    trades, wave contests and prio. In some matchups you physically can't win trades without it. It goes
    hand in hand with trading. The hosts' rule is that you should always be leaning to one side of mid,
    and if you're not leaning, you shouldn't be pushing. They also treat a good ward you don't lean toward
    as a red flag for rank.
  sources:
  - episode_id: 71c133Qc6uI
