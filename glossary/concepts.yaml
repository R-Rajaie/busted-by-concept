- term: front to back
  aliases:
  - front-to-back teamfight
  - playing front to back
  - straight front to back
  meaning: Front to back is the classic way of fighting a teamfight. Each team lines up a frontline of
    tanks to absorb damage so the backline carries (ADC, mages) can hit safely from behind. Players 'sit
    front to back' and peel the fed carry, as Ahri does for a Jinx. Champions like Azir are said to 'win
    the front to back', and Darius is told to play like a peel tank in front of his carries. The hosts
    contrast it with diving and assassin play, which bypasses it with terrain and vision, several divers
    collapsing on one target, or a split pusher on the side.
  sources:
