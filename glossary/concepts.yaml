  meaning: 'The hosts'' joke archetype of the impulsive, low-discipline solo queue player who "comes off
    the surf" and wants to run in and throw hands. He locks a brawler like Darius or Garen, rushes in
    without thinking, and gets upset when the game won''t let him. The hosts use him to illustrate non-interactive
