  - episode_id: 8bXmcBHJhbQ
    t: 1111
- term: outplayed
  aliases:
  - getting outplayed
  - good death
  meaning: A category of loss or death where you had the information and made a sound decision, but the
    opponent was simply better or more creative in that situation. The hosts separate it from not understanding
    the game and from your own mechanical misexecution. Because you can name it, you can accept it without
    tilt or an ego hit ("props to him"), stay curious, and review for what to learn. It's a "good death"
    and is treated as a healthy part of learning.
  sources:
