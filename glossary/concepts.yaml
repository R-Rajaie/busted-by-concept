- term: front to back
  aliases:
  - front-to-back teamfight
  - front line / no front line
  - playing front to back
  - straight front to back
  meaning: 'The traditional way of fighting a 5v5: the teams line up with tanks/frontline absorbing damage
    while backline carries (ADC, control mages) stay behind and use abilities and autos at range on the
    closest target, rather than diving, flanking or splitting. Champions like Azir, Malzahar, Orianna
    or a peeling Ahri ''win the front to back'' by sitting behind the frontline and peeling the carry,
    whereas assassins and divers (Zed, Xin Zhao) avoid it by looping the side, collapsing on one target,
    or using side lanes and man advantages to bypass it.'
  sources:
  - episode_id: 5oiwK6rlcRQ
    t: 650
  - episode_id: BEfG6R5pjqg
    t: 4297
  - episode_id: y1_ZVnTtzEc
    t: 652
  - episode_id: 2CXi04mpPkM
    t: 1562
- term: flank
  aliases:
  - flanking
  - threaten the flank
  - flank angle
  - multi-threat
  - coming from behind
  meaning: 'Engaging from the side or behind, from an angle the enemy isn''t watching, rather than front
    to back. Flankers (Twitch, Rengar, Sett with Flash, Diana, Rek''Sai) wait for a fight to start and
    use fog of war, bushes and a creative angle to reach the carries. They want assassinations and pick-offs,
    and they fight best when the enemy has no vision of the approach. Even just threatening a flank pulls
    enemy attention and cooldowns. The defensive side is to group up, ward your flanks, track missing
    threats and hold CC, because champions like Caitlyn, AD Shaco and other ADCs are weak when flanked.
    A fed Smolder or any fed AD carry is beaten by flanking, not by diving the front. Natty Nat''s Rengar
    play adds a flank rule: stay on the opposite side of the map from your team while they siege.'
  sources:
  - episode_id: ucBNpFPiZJc
    t: 2396
  - episode_id: ucBNpFPiZJc
    t: 3988
  - episode_id: 31x5bhl1GoA
    t: 4839
  - episode_id: 2CXi04mpPkM
