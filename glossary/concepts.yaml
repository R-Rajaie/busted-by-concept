- term: lull state
  aliases:
  - lull states
  - major lull states
  - miniature lull states
  - mini lull states
  meaning: Downtime in a game when little is happening and your mental bandwidth is free, such as walking
    back to lane, between waves or trades, or clearing a known camp. Major lull states are long (dead,
    coming off a reset) and miniature ones are brief (last hitting, mid-camp); use them to gather information
    and zoom out.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 131
  - episode_id: ANlsvzO-fdc
    t: 1611
  - episode_id: EgAO9qiKYm4
    t: 1920
  - episode_id: EgAO9qiKYm4
    t: 2052
  - episode_id: G1A0U5bJRZM
    t: 767
  - episode_id: uZQvmLrUVKM
    t: 3341
- term: quantity and quality of lull states
  aliases:
  - lull state usage
  meaning: 'Two ways to improve at lull states: quantity is how often you have them, which grows with
    champion mastery and muscle memory, and quality is how quickly and well you gather and process information
    in them.'
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 289
- term: 20 percenters
  aliases:
  - 20 percenter
  - 20%ers
  - big fish
  meaning: Massive, high-impact skills, habits or mistakes (like lull state usage, jungle tracking, reset
    timers, champ identity) that make up a large share of your improvement. Fixing them changes results
    far more than fine details.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 454
  - episode_id: Jbw9Dq4GWUc
    t: 3734
  - episode_id: ANlsvzO-fdc
    t: 1907
  - episode_id: EgAO9qiKYm4
    t: 10887
- term: one percenters
  aliases:
  - 1 percenters
  - 0.1 percenters
  meaning: Small, low-impact refinements that barely move the needle, becoming more relevant at higher
    ranks once the 20 percenters are drained.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 1943
  - episode_id: EgAO9qiKYm4
    t: 10917
- term: overwhelmed mental stack as a red light
  aliases:
  - mental stack overwhelmed
  meaning: Feeling overwhelmed (stress, anxiety, confusion, anger) signals you don't have a handle on
    a situation. Investigate it in review, which also develops your mental stack.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 889
- term: respecting the mental stack
  aliases: []
  meaning: Accepting that everyone, even challengers, makes basic mistakes when their mental stack is
    overwhelmed, so you shouldn't dismiss mistakes as just being bad.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 1013
- term: intensity
  aliases:
  - high intensity
  - playing with intensity
  - low intensity
  - autopilot (low intensity)
  - repetition with intention and intensity
  - keeping high intensity
  meaning: How focused and deliberately engaged you are in a game, as opposed to being on autopilot. It
    covers actively using lull states, posture, having your life in order, and not rolling over when behind;
    it's about inputs, not outcomes, and is why you play only about three games per block.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 732
  - episode_id: Jbw9Dq4GWUc
    t: 1221
  - episode_id: Jbw9Dq4GWUc
