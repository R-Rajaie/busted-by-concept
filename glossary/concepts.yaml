- term: execution phase
  aliases:
  - learning and execution phases
  - execution
  meaning: 'Curtis''s learning-versus-execution split, which applies at two levels. Across a SoloQ journey,
    you work a learning objective for a few weeks until it''s a habit or muscle memory. Then you spend
    an execution phase (he mentions about two weeks) with nothing new to focus on: you just play, results-focused
    and with little reflection, to see where the new skill gets you. When results stop coming, you go
    back to the learning phase, like Swagnar''s company switching between a metrics focus and a process
    focus. Within a single game, the same split appears as executing in moments with no time to think
    (skirmishes, ganks, fights), where you rely on muscle memory. Those moments alternate with ''lol states'',
    where you think and calibrate before executing again.'
  sources:
