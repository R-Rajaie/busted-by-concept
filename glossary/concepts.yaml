- term: one percenters
  aliases:
  - 1 percenters
  - 0.1 percenters
  meaning: Small, low-impact refinements that barely move the needle, becoming more relevant at higher
    ranks once the 20 percenters are drained.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 1943
  - episode_id: EgAO9qiKYm4
    t: 10917
- term: overwhelmed mental stack as a red light
  aliases:
  - mental stack overwhelmed
  meaning: Feeling overwhelmed (stress, anxiety, confusion, anger) signals you don't have a handle on
    a situation. Investigate it in review, which also develops your mental stack.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 889
- term: respecting the mental stack
  aliases: []
  meaning: Accepting that everyone, even challengers, makes basic mistakes when their mental stack is
    overwhelmed, so you shouldn't dismiss mistakes as just being bad.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 1013
- term: intensity
  aliases:
  - high intensity
  - playing with intensity
  - low intensity
  - autopilot (low intensity)
  meaning: Intensity is how fully you commit to a game. The hosts define it simply as playing with intention
    (a reason or hypothesis behind each decision), using your lull states, and trying your best, as opposed
    to autopilot or low intensity. It also includes physical engagement (upright posture, gripping the
    mouse) and having your life in order (eaten, showered, nothing else on your mind). It is all inputs
    and says nothing about the result, since you can play with high intensity and still lose. It is why
    they cap a session at about three games (a three block), which is roughly how long you can keep it
    up.
  sources:
  - episode_id: Jbw9Dq4GWUc
