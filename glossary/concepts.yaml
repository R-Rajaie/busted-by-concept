- term: one trick
  aliases:
  - OTP
  - one-trick
  - one tricking
  - one trick pony
  meaning: 'A player who plays almost exclusively a single champion. The hosts treat it as a learning
    strategy: sinking games into one champ builds muscle memory and frees the mental stack, so you can
    think holistically about the game (win conditions, matchups, tracking). It can also over-index one
    skill and leave fundamentals thin, so a one trick''s rank may overstate their general skill. It is
    the most optimal way to climb in top lane but boring, and it works best for obsessed players. At Master+
    Curtis now favors a broader, meta-adaptive pool.'
  sources:
