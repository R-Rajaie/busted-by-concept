    t: 1385
- term: end of review
  aliases:
  - EOR
  - end of review mistake
  - end of review moment
  - end of review process
  meaning: The decisive mistake or missed opportunity that pushes the game into a harder alternate reality,
    so there's little point reviewing past it. It's a mindset for players and a tool for coaches to find
    the one or two pivotal moments, and the game isn't necessarily lost afterward.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 974
  - episode_id: ANlsvzO-fdc
    t: 1240
  - episode_id: EgAO9qiKYm4
    t: 11075
- term: alternate reality
  aliases:
  - alternative universe
  - different universe
  meaning: After a major early error (an 'end of review' mistake), you branch, as in a decision tree,
    into an 'alternate reality' or 'different universe'. In it you have fewer options, the game is chaotic,
    complicated and unstructured, and it is much easier for the enemy team, so you must bend over backwards
    to win. Because of the snowball nature of the game you can't go back, though you can still dig out.
    Separately, the hosts imagine 'alternative universes' in which you made the right play (for example,
    taking a missed dive) to find the one learning per game.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 1066
  reviewed: suggested
- term: snowball nature of League
  aliases:
  - respect the snowball
  meaning: Early advantages and mistakes compound, so you can't play the early game averagely and expect
    to make up for it later.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 1027
- term: capitalizing on enemies mistakes mindset
  aliases: []
  meaning: After an end of review mistake, accept the game is now dictated by enemy errors and keep playing
    to win.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 1308
- term: learning objective
  aliases:
  - learning objectives
  - learn objective
  meaning: A learning objective is a specific thing you direct your attention to, in game or out of game,
    to narrow your focus (e.g. jungle tracking, warding and leaning, looking at lanes), so you pick one
    or two things instead of being overwhelmed by everything in League. The hosts split these into in-game
    and out-of-game (post-game review) objectives. In-game ones tax the mental stack, so they set very
    few (usually just one, and simple), while out-of-game ones can number two or three. Most objectives
    therefore end up post-game, and they are best judged over a sample of several games.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 1441
  - episode_id: rWp2ZO2zHy4
    t: 369
  - episode_id: rWp2ZO2zHy4
    t: 1380
  - episode_id: G1A0U5bJRZM
    t: 2264
  reviewed: suggested
- term: in-game learning objective
  aliases:
  - in game learning objectives
  meaning: A learning objective focused on while playing; since it taxes mental stack you typically set
    only one, more carefully for laners than junglers.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 1483
- term: out of game learning objective
  aliases:
  - outer game
  - out-of-game learning objective
  meaning: A learning objective worked on in review rather than during play; it doesn't tax mental stack
    so you can set two or three.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 1540
- term: never go from learning objective to learning objective
  aliases:
  - default back to fundamentals
  - revisit the basics
  meaning: After an objective becomes muscle memory, return to refining basic fundamentals before taking
    another specific objective, since stacking them overwhelms the mental stack.
  sources:
  - episode_id: rWp2ZO2zHy4
    t: 1608
- term: first eight minutes learning objective
  aliases:
  - not dying in the first 8 minutes
  meaning: A default fundamentals objective covering warding, leaning, basic jungle tracking, threat assessment,
    dragon, and not dying early.
  sources:
  - episode_id: rWp2ZO2zHy4
    t: 1665
- term: champion pool cycling
  aliases:
  - champ pool cycling
  meaning: 'A champion pool management process: you commit to a small pool (usually about 2-4 champs,
    depending on rank and champion complexity) and, when you want to change it, drop only one champion
    and add one new one at a time instead of overhauling the whole pool. This avoids burnout from one-tricking
    and big LP losses from abrupt pool changes, keeps play fresh, and each new champ should get a fair
    trial (around 30-45 games) before you bail.'
  sources:
  - episode_id: ANlsvzO-fdc
    t: 1729
  - episode_id: EgAO9qiKYm4
    t: 785
  reviewed: suggested
- term: champ hopping rule (30 to 45 games)
  aliases:
  - healthy champ hopping
  meaning: Give each new champion roughly 30-45 games before judging it; bailing constantly is a red flag.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 1848
- term: BBC pyramid
  aliases:
  - stage 1-4
  - Stage 1, 2, 3, 4 model
  - the pyramid
  - stages (the pyramid)
  - BBC pyramid scheme
  meaning: 'Curtis''s framework for categorizing mistakes, drawn as a pyramid and branded the BBC pyramid.
    Stage 4 is the base: out-of-game problems such as your relationship with the game and tilt from earlier
    games. Above it, stage 3 covers reference points, win condition, and role in the comp. Stage 2 covers
    whether a decision makes sense from a macro view. Stage 1 is at the top and covers execution, such
    as missed skill shots. When reviewing, you start at stage 4 and work up, though with practice you
    can go straight to stage 1 when the mistake is obviously one.'
  sources:
  - episode_id: ANlsvzO-fdc
    t: 1387
  - episode_id: 1AO2iZwUt9s
    t: 85
  - episode_id: 1AO2iZwUt9s
    t: 1772
  - episode_id: 1AO2iZwUt9s
