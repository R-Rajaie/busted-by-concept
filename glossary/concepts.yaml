# The show's own named ideas. Drafted by coach.glossary.concepts; review by hand.
- term: mental stack
  aliases:
  - mental bandwidth
  meaning: The mental stack is the hosts' term for your mental bandwidth, meaning how occupied your mind
    is. It is limited by working memory, and it decides how much you can track and execute in a game (information
    gathering, fights, abilities) before you get overwhelmed. It develops over long play through reps,
    muscle memory and pattern recognition, and it caps out if you play without intention. A heavy or unfamiliar
    load, such as a new champion or mechanic like Mel's reflect, throws it off and causes basic mistakes.
    This is why the hosts keep in-game learning objectives to about one, and why lull states, when the
    stack is free, are used to gather information.
