- term: death cycle
  aliases:
  - chain death
  - staggered death timers
  - chain-ins
  meaning: 'A chain reaction in which one player dies while their team is off the map (in base, resetting,
    or clearing camps). The teammates then walk in without them or try to make up for it and die too.
    Everyone ends up desynced on death timers, and the game becomes a chaotic series of picks. The way
    out is to sink pressure: be on the map when your team is, and back off or reset when they do. Don''t
    die when the team isn''t ready to follow up.'
  sources:
  - episode_id: 9rUbtBCanT0
    t: 884
