  reviewed: suggested
- term: master of the champion
  aliases: []
  meaning: Someone who has performed with the champion at Master+ rank; below that a player may have mechanics
    but lacks the champion's macro limitations, so has half the mastery.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 1952
- term: champion first, game fundamentals second
  aliases:
  - champion mastery before fundamentals
  - champ mastery first
  - learn the game through a champion
  meaning: 'The hosts'' philosophy that you should learn the game through the lens of your champion: for
    true beginners, focus first on the champion''s specifics (ability usage, how to trade, when it is
    strong, how to cast the ult, how to do damage without taking damage and win fights) and set aside
    generic fundamentals like wave management, resets, jungle tracking, warding, threat assessment and
    roaming. Only after roughly 60-80 games on that champion do you turn to those fundamentals, which
    are still important but come second.'
  sources:
  - episode_id: EgAO9qiKYm4
    t: 195
  - episode_id: 1AO2iZwUt9s
    t: 5410
  - episode_id: 1AO2iZwUt9s
    t: 5495
  reviewed: suggested
- term: champion mastery → role mastery → game mastery
  aliases:
  - mastery order
  - bedrock of champ mastery
  meaning: 'The learning order: champion mastery frees mental stack for role mastery, which frees you
    for bigger game concepts and comps. You can''t skip steps.'
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 1053
- term: can play a champion
  aliases:
  - I can play the champ
  meaning: 'Ordinary players say \"I can play the champ\" when they land a few good trades, roams or kills.
    The hosts hold a higher standard: you can pilot the champion through the whole game and every phase
    of it, across metas. That means adapting to your role, win condition and team comp, even from a bad
    start, and getting the most out of every ability with good threat assessment and knowledge of your
    limits.'
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 905
  reviewed: suggested
- term: win condition
  aliases:
  - win con
  - win conditions
  - win condition assessment
  - win con assessment
  - reading a win con
  meaning: A strategic avenue for winning a game based on kit strengths, who is fed or weak, and objectives;
    it can change and several can coexist. Reading whether you or someone else is the win condition has
    a high skill cap and becomes a big focus around Emerald+.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 2129
  - episode_id: EgAO9qiKYm4
