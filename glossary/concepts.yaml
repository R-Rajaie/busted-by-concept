  - episode_id: uZQvmLrUVKM
    t: 359
  - episode_id: uZQvmLrUVKM
    t: 628
  - episode_id: uZQvmLrUVKM
    t: 1305
  - episode_id: uZQvmLrUVKM
    t: 1878
  - episode_id: uZQvmLrUVKM
    t: 5495
- term: stage three
  aliases:
  - stage 3
  - stage 3 issues
  - stage three issues
  - big picture thinking in game
  - big picture in game mindset issues
  - layer two
  - zooming out
  meaning: 'The pyramid level about how you think as your champion: identity, reference points, role,
    win condition and the player''s view of the game. Mistakes here mean you don''t know what you should
    be doing, and many players misdiagnose them as stage 2 issues.'
  sources:
  - episode_id: 1AO2iZwUt9s
    t: 743
  - episode_id: 1AO2iZwUt9s
    t: 1372
  - episode_id: uZQvmLrUVKM
    t: 1949
  - episode_id: uZQvmLrUVKM
    t: 2452
  - episode_id: uZQvmLrUVKM
    t: 3251
  - episode_id: uZQvmLrUVKM
    t: 3665
  - episode_id: uZQvmLrUVKM
    t: 4317
  - episode_id: uZQvmLrUVKM
    t: 5529
- term: stage two
  aliases:
  - stage 2
  - decision making stage
  - in-game decision-making issues
  - anticipation
  meaning: 'The layer of decision making and anticipation: knowing what to do, what the opponent will
    do, and what to look at (macro rotations, fights, trades). Often a knowledge or experience gap that''s
    easy to fix, and tied to pattern recognition.'
  sources:
  - episode_id: 1AO2iZwUt9s
    t: 1213
  - episode_id: uZQvmLrUVKM
    t: 3723
  - episode_id: uZQvmLrUVKM
    t: 4341
  - episode_id: uZQvmLrUVKM
    t: 5284
  - episode_id: uZQvmLrUVKM
    t: 5588
- term: stage one
  aliases:
  - stage 1
  - top of the pyramid
  - execution stage
  meaning: 'Pure mechanical execution: you know the right call and attention but fumble the input (missed
    skillshot, bad flash). A small cherry on top that rarely is the real problem.'
  sources:
  - episode_id: 1AO2iZwUt9s
    t: 1456
  - episode_id: uZQvmLrUVKM
    t: 4647
  - episode_id: uZQvmLrUVKM
    t: 5284
- term: stage one goblins
  aliases:
  - stage two goblins
  meaning: Joking label for players whose personality over-emphasizes one stage of the pyramid.
  sources:
  - episode_id: uZQvmLrUVKM
    t: 5688
- term: cycling through the stages
  aliases:
  - the cycle
  meaning: Players keep moving through the pyramid as they learn, returning to stage 4 and repeating.
  sources:
  - episode_id: uZQvmLrUVKM
    t: 5558
- term: 1-3-1
  aliases:
  - 1-3-1 lane assignment
  meaning: Mid-game assignment of one top, three mid, one bot; risky and mostly competitive, usable temporarily
    before a 1-4.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 2597
- term: 1-4
  aliases:
  - 4-1
  - 4-1ing
  meaning: Mid-game assignment with one player in a lane and four grouped on another to siege; more consistent
    in solo queue, best as one mid and four on a side.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 2645
- term: get into the details
  aliases:
  - GITD
  - getting specific
  - get specific
  meaning: 'A mindset and behavior that rejects generic questions and checklist advice: pull up the VOD,
    look at what actually happened and name exactly what went wrong, then ask if it''s reasonable for
    your stage.'
  sources:
  - episode_id: ANlsvzO-fdc
    t: 2199
  - episode_id: EgAO9qiKYm4
    t: 11435
  - episode_id: 2WQ8zHtK6fc
    t: 5135
- term: broken by concept
  aliases:
  - BBC
  meaning: Something whose sheer existence is so overpowered that number tuning can't fix it. Nathan coined
    it over movement speed quintessences; now also a loose phrase for anything absurdly good.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 2809
  - episode_id: EgAO9qiKYm4
    t: 8489
  - episode_id: EgAO9qiKYm4
    t: 8531
- term: inconsistency (doesn't exist)
  aliases:
  - consistency
  - inconsistent
  meaning: Perceived inconsistency is really facing different puzzles each game; wins come from known
    puzzles and losses from unknown ones, so treat losses as fixable.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 3062
- term: League as a thousand concepts
  aliases:
  - theory and execution components
  - concepts you understand
  meaning: League is about a thousand concepts, each with theory and execution components; an Iron player
    knows maybe 50. Use every game to pick up new ones.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 3201
- term: logical mindset about toxic players
  aliases:
  - empathy for them
  - not going down to their level
  meaning: Treat a flamer as at an earlier stage of development, feel pity not anger, and keep following
    your own process.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 3762
- term: solo queue as a mental quest
  aliases:
  - make it a minigame
  - mental quest
  meaning: When a teammate is inting, reframe the game as a creative problem-solving challenge while building
    mental fortitude.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 3959
- term: pretend they don't exist
  aliases:
  - ignore the person
  - mute all
  meaning: Ignore and mute someone provoking you, acting as if they aren't in the game.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 3924
- term: losses as indicators
  aliases:
  - losses are indicators that you need to change your behavior
  meaning: Treat losses as signals your behavior needs to change rather than blaming external factors.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 4561
- term: frustration is not understanding
  aliases:
  - frustration comes from confusion
  - game is a puzzle
  meaning: Frustration and tilt mainly come from confusion; frustrating situations are puzzles you haven't
    learned to solve.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 4480
- term: mood player
  aliases: []
  meaning: A self-label for a player whose emotions dictate decisions; it builds a fixed identity, so
    instead identify the specific frustration.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 4452
- term: lead by example
  aliases:
  - express your level play
  meaning: You change teammates' behavior by earning authority through competence; team games are where
    you show your level, while improvement happens individually.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 4829
  - episode_id: ANlsvzO-fdc
    t: 4978
- term: tackle issues in isolation
  aliases:
  - solve them one by one
  meaning: Treat each problem (mood, caffeine, champion pool) as a separate issue and fix them one at
    a time.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 4646
- term: sandwich technique
  aliases:
  - shit sandwich
  meaning: Give teammates criticism wrapped between praise and encouragement.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 4930
- term: accountability
  aliases:
  - taking responsibility
  meaning: Owning your own input in specific moments of a game, not blaming yourself for the result; the
    cornerstone of good learning, though taking too much is also an error.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 260
- term: threat assessment
  aliases:
  - knowing limits
  meaning: Knowing when you can go forward, kill someone, or take trades, down to within 10-20 damage;
    scales indefinitely.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 1006
- term: detaching from LP
  aliases:
  - focusing on the learning over the LP
  meaning: Treat LP as a byproduct and measure of your level, valuing each game by what you learned; detach
    from gaining as well as losing it.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 1108
- term: every game is the least important game and the most important game
  aliases: []
  meaning: No single game matters much on its own, but each counts as part of your long-term journey.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 1249
- term: League Enlightenment
  aliases:
  - League of Legends nirvana
  meaning: Being detached from LP and focused on process, usually reached only after feeling LP's sting.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 1284
- term: expectations
  aliases:
  - toxic expectations
  - unreasonable expectations
  - healthy vs unhealthy expectations
  meaning: The number one source of tilt and stage four issues when they concern things outside your control
    (teammates, matchmaking, deadlines); expectations tied to your own standards are fine.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 1399
  - episode_id: uZQvmLrUVKM
    t: 1168
- term: the word "should"
  aliases: []
  meaning: 'Warning sign of unreasonable expectations: saying ''they should have'' means you aren''t adapting
    to reality.'
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 1627
- term: adaption and embracing reality
  aliases:
  - the chaotic nature of SoloQ and your ability to adapt to it
  meaning: Accept how SoloQ actually plays out and adapt with open-mindedness instead of 'should' thinking.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 1643
- term: fighting
  aliases:
  - fighting game
  meaning: Winning fights is the basic requirement for winning, historically under-taught.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 1691
- term: out fight bad macro
  aliases:
  - you can out fight your way out of bad macro but you can't out macro your way out of bad fighting
  meaning: Strong fighting can cover poor macro but good macro can't cover poor fighting.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 1938
- term: growth mindset
  aliases:
  - fixed mindset
  - fixed mindset (opposite)
  meaning: Believing effort and practice let you improve, so every game is a chance to learn. The opposite,
    a fixed mindset ('noob or beast', needing to look talented), produces ego protection, insecurity and
    toxicity.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 2032
  - episode_id: 2WQ8zHtK6fc
    t: 4931
  - episode_id: EgAO9qiKYm4
    t: 8893
  - episode_id: EgAO9qiKYm4
    t: 8982
  - episode_id: uZQvmLrUVKM
    t: 387
- term: joy
  aliases:
  - fun
  meaning: Enjoying League as a hobby, not a second job; without it you won't be curious or play with
    intensity.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 2430
- term: community
  aliases:
  - sharing your journey
  meaning: Sharing your climb with others to celebrate wins and make the lonely SoloQ journey feel shared.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 2489
- term: kindness
  aliases:
  - being kind to yourself
  - self-love
  meaning: Being kind to yourself, giving breathing room after mistakes and counting process wins.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 2594
- term: long-term thinking
  aliases:
  - marathon not a sprint
  meaning: Judging your journey in months rather than single games, and keeping playing after a bad early
    moment.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 2762
- term: execution
  aliases:
  - League is a game of execution
  - disrespect for the execution of the game
  meaning: Consistently applying the knowledge you have in game; tied to mental stack. The hosts criticize
    glossing over mechanical mistakes and blaming macro or teammates.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 3098
  - episode_id: 1AO2iZwUt9s
    t: 1702
- term: signal versus noise
  aliases:
  - noise
  - signal
  meaning: Noise is conflicting opinions and low-value information (YouTube, meta, chat, niche scenarios)
    to cut out; signal is the useful high-value learnings and the key info to read on the map.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 3157
  - episode_id: 2WQ8zHtK6fc
    t: 3231
  - episode_id: G1A0U5bJRZM
    t: 679
- term: writing a thesis on their game
  aliases: []
  meaning: Reviewing every little decision instead of prioritizing; it doesn't work.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 3247
- term: open-minded
  aliases:
  - open-mindedness
  meaning: Willing to admit your read was wrong instead of blaming others, and adapt.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 3275
- term: thousands of miniature hypotheses
  aliases: []
  meaning: In game you constantly predict outcomes and reality confirms or disproves them; closed-minded
    players blame others when wrong.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 3328
- term: quality versus quantity
  aliases:
  - Goldilocks zone
  meaning: Improvement needs enough reps but not so many that quality drops; find the zone of games you
    can play at high intensity.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 3479
- term: League as a hobby
  aliases:
  - accepting where League is in your life
  meaning: Accept League as a meaningful hobby, not your whole life or a big event.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 3860
- term: man in the arena
  aliases:
  - theory versus practice
  - get in the arena
  - Rift as your dojo
  meaning: Value the person who plays and makes mistakes over the theorist; practice on the Rift instead
    of only watching content.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 3886
- term: tough conversation with yourself
  aliases:
  - the conversation you have with yourself
  meaning: Honestly questioning why you throw games or avoid review; unpleasant but leads to growth.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 4022
- term: utopia
  aliases:
  - solo queue utopia
  meaning: The unrealistic wish for a perfect, easy solo queue with good teammates.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 4073
- term: VOD review
  aliases:
  - VOD reviewing
  meaning: Reviewing your own games to find what to do better; a real skill that takes time.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 4231
- term: quick VOD review
  aliases:
  - don't over review
  meaning: Use your feelings to jump to bad points, take one or two learnings and leave; improve through
    many quick reps.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 4349
- term: X Factor
  aliases:
  - X-Factor
  meaning: An edge or unconventional creativity that lets you exceed expectations, mostly relevant at
    higher Elo.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 4412
- term: Zoom out
  aliases:
  - zooming out
  - looking through other people's lenses
  meaning: Seeing the game through teammates' perspectives and putting a game or block in perspective
    of your longer journey.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 4639
- term: soloq journey
  aliases:
  - your journey
  meaning: Each player's climb is unique, so don't compare yourself to others.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 4544
- term: know your why
  aliases:
  - your why
  - knowing your why
  - accepting your player identity
  - aligned with your why
  meaning: Having a clear personal reason for playing; stage four issues develop when your actions contradict
    it.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 4364
  - episode_id: uZQvmLrUVKM
    t: 1527
- term: identity level versus behaviour level
  aliases:
  - changing your language
  meaning: Judge specific actions ('my Q's were filthy') rather than yourself as a person, detaching self-worth
    from rank.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 4832
  - episode_id: 2WQ8zHtK6fc
    t: 5185
- term: insecurity
  aliases: []
  meaning: A sign you aren't accepting your actual capacity, stemming from caring about others' opinions
    and a fixed mindset.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 4910
- term: perfectionism and elitism
  aliases:
  - high standards
  meaning: Holding very high standards without a process; unsustainable. Fix by getting specific.
  sources:
  - episode_id: 2WQ8zHtK6fc
    t: 4977
- term: tempo
  aliases:
  - ahead in tempo
  - behind in tempo
  - off tempo
  meaning: 'The relative time advantage between you and your opponent: ahead means you finish tasks first
    and can act first.'
  sources:
  - episode_id: EgAO9qiKYm4
    t: 1004
- term: tempo reset
  aliases:
  - tempo base
  meaning: Recalling while ahead in tempo so it's free and the opponent can't punish.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 1217
- term: priority
  aliases:
  - prio
  - do you have move
  meaning: Ability to move to a play first, usually via wave push; fleeting.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 1477
- term: fake prio
  aliases: []
  meaning: A lane that looks like it has priority but doesn't (opponent full resources, pusher low mana
    or needs to base).
  sources:
  - episode_id: EgAO9qiKYm4
    t: 1612
- term: quality of priority
  aliases:
  - hard prio
  - soft prio
  meaning: Hard prio is a fresh fully pushed wave or a low opponent; soft prio is a late push with the
    next wave close.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 1639
- term: fundamentals
  aliases:
  - respecting the fundamentals
  - the basics
  meaning: Core game concepts that give consistent play regardless of champion (resets, trading, warding,
    looking at lanes, jungle tracking, threat assessment). The highest-level players keep respecting them.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 1698
  - episode_id: EgAO9qiKYm4
    t: 1829
  - episode_id: rWp2ZO2zHy4
    t: 1745
- term: mental stack allocation
  aliases:
  - moving your mental stack around
  - allocating your energy
  - where to direct attention
  - directing energy within the mental stack
  meaning: Intentionally choosing which information to prioritize in your limited mental stack for the
    matchup and game state, and directing attention to what wins games rather than what doesn't matter.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 2270
  - episode_id: G1A0U5bJRZM
    t: 2060
  - episode_id: G1A0U5bJRZM
    t: 2569
- term: playing slow
  aliases: []
  meaning: Conserving resources, trading less and focusing on survival, farming and info, used when behind.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 2490
- term: playing fast
  aliases: []
  meaning: Trading often and creating chaos when you have an advantage; can overwhelm the enemy's mental
    stack.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 2504
- term: sync pressure
  aliases:
  - synchronized pressure
  meaning: Applying pressure on the map at the same time as teammates; if your team is in base, don't
    make solo plays. The macro-scale version of multi-threat.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 3502
  - episode_id: EgAO9qiKYm4
    t: 6392
- term: hovering
  aliases:
  - hover
  - complimenting your jungler
  - shadowing
  - hover your jungler
  meaning: Preemptively placing yourself near a teammate or jungler because you anticipate action, usually
    in fog of war, to assist with their path; unrelated to praise.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 3658
  - episode_id: EgAO9qiKYm4
    t: 6392
- term: shove and hover
  aliases: []
