  - episode_id: 1AO2iZwUt9s
    t: 5236
- term: levels of intention
  aliases:
  - quality of intention
  meaning: Intention exists on a spectrum from simplistic (he's low, I'll kill him) to hyper-intentional,
    and even a little is better than none and deepens as you learn.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 5582
- term: autopilot
  aliases:
  - intuition
  - instinct
  - muscle memory
  meaning: 'Autopilot is making decisions solely from muscle memory and intuition, without bringing intention
    to the forefront. Muscle memory is one ingredient of it, not quite the same thing. The hosts treat
    autopilot as the negative connotation of intuition or instinct, and they link over-relying on it to
    playing without intention and plateauing. It isn''t necessarily bad: for a sophisticated player some
    responses are so obvious (standing behind minions against Blitzcrank, or not fighting a Malphite with
    R) that they are borderline intuitive, though the hosts say it''s still good to do them intentionally.'
  sources:
  - episode_id: EgAO9qiKYm4
    t: 5714
  reviewed: revised
- term: champion identity
  aliases:
  - champ identity
  - champ's identity
  meaning: 'A high-level description of what a champion fundamentally is about: its strengths and weaknesses,
    how it should optimally play, and why it wants to do what it does. It is largely based on the kit
    but is an interpretation, and it can be flexible. Its purpose is to let you think as the champion,
    and its main practical use is knowing what to avoid. Many decisions can be tied back to it, and reference
    points are derived from it.'
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 1384
  - episode_id: EgAO9qiKYm4
    t: 216
  - episode_id: 1AO2iZwUt9s
