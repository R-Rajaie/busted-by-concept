- term: Mott's law
  aliases: []
  meaning: A tongue-in-cheek rule about not generalising from an exceptional player to the average one.
    If something works for a high-level player like Nathan or Charles, such as playing an off-pool champion
    or shrugging off spam pings with 'zero mental' impact, that doesn't make it good advice, because the
    average player doesn't get the same result. 'If I can do it, then it's all good' proves nothing, and
    the law is invoked to dismiss that reasoning.
  sources:
  - episode_id: CaxxF1sWFwM
    t: 1378
  - episode_id: 9rUbtBCanT0
    t: 7945
- term: tempo trap
  aliases:
  - getting tempo trapped
  - creating a tempo trap
  meaning: Punishing an opponent's reset or tempo by staying near them instead of backing with your team,
    so you catch them or block their recall and cost them farm, plates, or tempo. A player can "tempo
    trap" you in lane (for example, the enemy support stops your recall while you overstay for plates).
    You can also create one yourself, for example by pushing waves and setting up a trap somewhere after
    a small swing instead of forcing a risky fight. The hosts treat this as part of reading how enemy
    players behave, so you can play around it.
  sources:
  - episode_id: 71c133Qc6uI
    t: 1675
  - episode_id: 71c133Qc6uI
    t: 3944
  - episode_id: HTgR0NqKvxQ
    t: 3187
- term: leaning
  aliases:
  - warding and leaning
  - leaning to your ward
  - lean
  meaning: 'A mid-lane fundamental. You place a ward on one side of the lane and then physically position
    yourself toward that warded side, so the unwarded side is the only place a gank can come from. It
    is defensive, because you can run away from a gank along the river instead of dying. It is also offensive,
    because the vision lets you step past the wave and take space, which gives you better trades and prio.
    The hosts'' rule: if you''re not leaning, you shouldn''t be pushing.'
  sources:
  - episode_id: 71c133Qc6uI
    t: 414
  - episode_id: kVB_oqug6C8
    t: 5226
  - episode_id: ntpv1MPiK5E
    t: 922
- term: disrespect
  aliases:
  - disrespecting the difficulty of the game
  - disrespect for the craft
  - lack of respect for the game
  meaning: Failing to respect how hard League of Legends is, and how much craft there is in playing and
    coaching it. Players assume it is simple because things look easy in isolation, so they expect fast
    results, think they are better than their rank, and blame teammates. The hosts say this is the root
    cause of toxic expectations, anger and ego problems. Their remedy is to make peace with the game's
    difficulty and trust process and fundamentals, because League will humble you otherwise. They also
    use it for the community's dismissal of coaching as a craft that takes years to learn.
  sources:
  - episode_id: 3gh-AlQTF_Q
    t: 1357
  - episode_id: nV5WHrYDGsc
    t: 3532
  - episode_id: 4_QeXN8wrKk
    t: 3150
  - episode_id: gER9YLKDfAk
    t: 598
- term: death cycle
  aliases:
  - chain death
  - staggered death timers
  - chain-ins
  meaning: 'A chain reaction in which one player dies while their team is off the map (in base, resetting,
    or clearing camps). The teammates then walk in without them or try to make up for it and die too.
    Everyone ends up desynced on death timers, and the game becomes a chaotic series of picks. The way
    out is to sink pressure: be on the map when your team is, and back off or reset when they do. Don''t
    die when the team isn''t ready to follow up.'
  sources:
  - episode_id: 9rUbtBCanT0
    t: 884
  - episode_id: 71c133Qc6uI
    t: 889
  - episode_id: CaxxF1sWFwM
    t: 2062
  - episode_id: RSFUIlTLYH4
    t: 2823
  - episode_id: kivnIR7Hj-8
    t: 3008
- term: final domino
  aliases:
  - last domino
  - last stand
  meaning: 'A mindset for games that are going badly: picture your team as a chain of falling dominoes
    with you as the last one still upright. Your job is to stay upright and keep holding the line, because
    if you fall the game is over. Instead of blaming teammates, you accept the weight, keep your team
    in the game and make the enemy sweat. The hosts add that it works best if you hold this mentality
    from the start of the game, with max accountability, and not only once the game has gone bad.'
  sources:
  - episode_id: qMcLBCTFDtI
    t: 2115
- term: carnivore ADC
  aliases:
  - carnivore hypercarry
  - carnivore ADC carries
  meaning: Dan's label for scaling ADCs that can't easily neutralize the wave and have to play to fight
    and trade in lane, such as Vayne, Twitch, Tristana and Aphelios. If they just last-hit and play passive,
    they get shoved in and bleed out and never reach their scaling. They need to look for good short trades
    and all-ins to relieve pressure. The opposite is the "herbivore" hypercarry, like Jinx or Sivir, which
    can play for the wave and neutralize more easily.
