- term: spawning gold for your opponent
  aliases: []
  meaning: 'A Summoner School Reddit climbing tip: when you''re losing lane, your opponent''s lane gold
    is capped by the fixed minions and plates, so each death adds gold beyond that cap. Instead, minimize,
    take the CS loss, and let your team carry rather than forcing plays. The hosts agree that dying gives
    the enemy gold and objectives while you get no gold or XP, and that gold comes from many sources besides
    kills. They don''t like how the post is framed, because it mixes the gold-cap idea with "don''t be
    the protagonist," and they don''t see how it affects other lanes.'
