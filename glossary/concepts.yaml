# The show's own named ideas. Drafted by coach.glossary.concepts; review by hand.
- term: mental stack
  aliases:
  - mental bandwidth
  - working memory
  - mental capacity
  - mental stack capacity
  - mental stack development
  - mental stack overload
  meaning: The limited pool of attention and working memory you have for everything going on in a game
    (CS, waves, jungle tracking, objectives, spell execution). Reps, muscle memory and pattern recognition
    free it up, while novel or overwhelming situations overload it and cause basic mistakes.
  sources:
