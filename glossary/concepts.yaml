- term: champion mastery
  aliases:
  - champ mastery
  meaning: 'Champion mastery is the level of expertise a player has on a champion, in both knowledge and
    execution. It is not in-game mastery points. It comes from lots of repetition played with intention
    and intensity, pushing the champion''s limits. It shows up as understanding the champion''s identity,
    reference points, good and bad ability usage, and good and bad fights and games. It also shows up
    as being able to pilot and adapt the champion through any game or comp, including winning hard games.
    It is tied to rank and exists on a scale: lower-ranked players can have real elements of it, but the
    hosts wouldn''t call someone a master of a champion until they''ve performed with it at about Master+,
    because that is where the macro limits become clear.'
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 1859
  - episode_id: 2WQ8zHtK6fc
