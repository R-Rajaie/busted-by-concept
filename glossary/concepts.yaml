  - episode_id: 7ONqlWcp51I
    t: 1586
- term: learning phase
  aliases:
  - learning phase vs execution phase
  - limit testing phase (when learning a champion)
  meaning: 'Curtis''s framework that a player''s SoloQ journey alternates between two phases. In the learning
    phase you are working on a set learning objective, putting in games over a few weeks until it becomes
    a habit or muscle memory, like adding a new piece of gear. Once it''s ingrained you switch to the
    execution phase: you stop focusing on anything new and just play with your upgraded skill set to see
    where it takes you, until you plateau and go back to learning. The hosts warn against leaving the
    learning phase too early (a ''toxic learning cycle''). When learning a champion, the same idea shows
    up as a ''limit testing'' phase, where risky plays are fine for learning but bad for climbing.'
  sources:
  - episode_id: MIZTyxIIx_o
    t: 1177
  - episode_id: xeqIhbhhSJQ
    t: 1321
  - episode_id: xeqIhbhhSJQ
    t: 1604
  - episode_id: Lt2jdNexdao
    t: 2280
- term: execution phase
  aliases:
  - learning and execution phases
  - execute phase
  meaning: The half of Curtis's two-phase model of a SoloQ journey. After a learning objective has been
    drilled into a habit or muscle memory, you stop focusing on anything new. You just play and express
    your best self with the new skill set, and see where it takes you and where you plateau. Only then
    do you go back to the learning phase to find the next weakness and set a new objective. Curtis warns
    that moving on from a learning objective before executing on it enough leads to a toxic learning cycle.
    In the moment-to-moment sense, 'execution' also means the points in a game where there is no time
    to think (skirmishes, ganks, fights) and you just rely on muscle memory. These alternate with thinking
    moments called 'lull states'.
  sources:
  - episode_id: MIZTyxIIx_o
    t: 1177
  - episode_id: xeqIhbhhSJQ
    t: 1321
  - episode_id: AFvILQ6y5nE
