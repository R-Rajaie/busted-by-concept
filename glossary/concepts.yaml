    t: 2592
- term: good death vs bad death
  aliases:
  - good death
  - bad death
  - good deaths and bad deaths
  meaning: 'Not every death is a mistake. A good death comes from pushing your limits: you believed it
    was the right play, went for it, and it didn''t work out, or you died in a fight you chose on purpose
    while doing your job (damage, engage) so your team could win it. A bad death comes from being unfocused
    or sloppy, such as not tracking the jungler, dying randomly, or dying with no objective up or your
    camps up. Review your deaths by which kind they were, not by KDA. Related to high value versus low
    value deaths.'
  sources:
