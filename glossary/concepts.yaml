- term: spacing and tethering
  aliases:
  - tethering
  - spacing
  meaning: Using your range relative to the enemy's to deal damage while taking none, staying out of their
    spell and auto ranges while remaining in yours.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 2611
  - episode_id: EgAO9qiKYm4
    t: 3171
- term: anticipation
  aliases: []
  meaning: Thinking ahead about what the opponent might do, the real reason players seem to dodge key
    abilities and tether; ties into occupying the enemy's mental stack.
  sources:
  - episode_id: EgAO9qiKYm4
    t: 3283
- term: short clicks and long clicks
  aliases:
  - short and long clicks
  meaning: Short clicks near your character let you turn quickly; long clicks send you far. Mixing them
    makes movement unpredictable and skillshots hard to land.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 2757
- term: high value death versus low value death
  aliases:
  - high value death
  - low value death
  - game winning death
  - high quality death
  - low quality death
  meaning: Judge a death by net gold, experience, time and resources gained and lost. A high value death
    makes the enemy burn summoners and ults and waste waves while you cost your team little; a low value
    death (bounty, stacked wave, Baron spawning, you burn flash) gives the enemy a cheap kill.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 2987
  - episode_id: Jbw9Dq4GWUc
    t: 3071
  - episode_id: Jbw9Dq4GWUc
    t: 3094
- term: high value kill versus low value kill
  aliases: []
  meaning: 'The same idea for kills: a kill is low value if you burn a key cooldown, like your ult on
    the support, and lack it for the next fight.'
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 3116
- term: high quality questions
  aliases:
  - high quality question versus low quality question
  - low quality questions
  - general questions get general answers
  - series of high quality questions
  meaning: The quality of the answer depends on the question. High quality questions are specific, controllable,
    show accountability and curiosity (and can be used to refocus when tilted); low quality ones are vague,
    venting or blame-shifting.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 3172
  - episode_id: ANlsvzO-fdc
    t: 4591
  - episode_id: 2WQ8zHtK6fc
    t: 2225
  - episode_id: EgAO9qiKYm4
    t: 8640
- term: ACE mentality
  aliases:
  - ACE
  - ACE framework
  - ACE mindset
  - Ace mentality
  meaning: 'A three-step framework for making in-game decisions: Acknowledge the best play, Communicate
    it to your team with pings, body language and chat, and Embrace reality, meaning actively accept the
    chaos of solo queue and what your team actually does, then pick your best response. Charlie says it
    is best used when you think a teammate isn''t aligned with you, because you can''t control your team,
    only influence it. It also works as a post-game review check and as a mindset for handling frustration,
    and it supports playing with intention.'
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 3331
  - episode_id: Jbw9Dq4GWUc
    t: 3355
  - episode_id: Jbw9Dq4GWUc
    t: 3385
  - episode_id: EgAO9qiKYm4
    t: 4558
  - episode_id: uZQvmLrUVKM
    t: 4190
  reviewed: suggested
- term: focus on the controllables
  aliases:
  - focus on what you can control
  meaning: 'Putting your attention only on what you can control: your own play, decisions, mistakes and
    learnings (for example, reviewing your VOD), rather than on teammates'' or opponents'' errors, flaming
    or trolling. In practice that means muting or turning off chat, letting a bad-ganking jungler die,
    copping the loss if someone AFKs, and taking responsibility for your own choices.'
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 3804
  - episode_id: ANlsvzO-fdc
    t: 3706
  reviewed: suggested
- term: getting 1% better every game
  aliases: []
  meaning: 'The hosts'' goal for improving: accept that you make a lot of errors and own them, and treat
    each game as part of your own journey. Go into every game trying to take as many learnings as you
    can, have a crack, and carry them into the next game to get 1% better each time. The result of the
    individual game doesn''t matter.'
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 3775
  reviewed: suggested
- term: you don't have the right to open chat
  aliases:
  - party chat on
  meaning: If you can't control your temper and are making game-losing errors, don't use all-chat; set
    chat to party-only.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 3862
- term: own the error / equal responsibility
  aliases: []
  meaning: When you die after a teammate (e.g. the jungler) makes a bad play, the hosts say you share
    equal responsibility, because you clicked the buttons and nobody made you do anything. If you'd had
    the foresight to read it as a bad play, or had simply said no and let the jungler die while you kept
    farming, you wouldn't have taken part. The point is to be more internal than external and not blame
    the teammate.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 3889
  reviewed: suggested
- term: graveyard of duoQ
  aliases: []
  meaning: The hosts' claim, based on what they have seen, that there is a 'graveyard' of players who
    duoQ'd and did not improve at the game. They use it to back their stance that duoQ is bad for learning,
    and it is the stance a listener challenges in the mailbag by saying duoing helped him improve.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 3994
  reviewed: suggested
- term: rubber duck troubleshooting
  aliases: []
  meaning: A programming technique where you explain a problem to a rubber duck. Saying it out loud, clearly
    and simply, makes you notice something you missed or see the problem differently. In duoing, it means
    constantly voicing map information, which pushes you to gather and internalize more of it, and voicing
    your plans and reasons, which pushes you to think ahead and check whether the plan is good.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 4224
  reviewed: suggested
- term: training grips analogy
  aliases:
  - grips
  meaning: Like lifting grips, a stable top laner handling top-side macro removes a limiting variable
    so the jungler can train other parts of the game.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 4355
- term: soft coaching
  aliases: []
  meaning: A more experienced player (e.g. duo partner) informally fills gaps in a newer player's knowledge.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 4452
- term: diminishing returns on duoQ
  aliases: []
  meaning: 'Duoing works like soft coaching for a new player: an experienced partner fills knowledge gaps
    and the new player learns fast. The benefit shrinks over time, once you have taken all the information
    from that one partner, and it is small for experienced players (''platinum and above''), who have
    little to learn and miss the deeper understanding of working things out themselves. The experienced
    partner often gains nothing, and may get worse by relying on the duo''s ganks and communication.'
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 4478
  reviewed: suggested
- term: duoQ as a bandaid for the mental stack
  aliases: []
  meaning: 'The hosts say duoQ (and comms) is appealing at first because a partner supplies information
    and covers up your inferior mental stack, but it''s only a bandaid: you aren''t actually developing
    your own mental stack. You also tend to take the partner''s info as gospel without processing it yourself,
    even though it can be wrong, and comms are often too slow for how fast the game moves.'
  sources:
  - episode_id: G1A0U5bJRZM
    t: 1821
  reviewed: suggested
- term: spoon-fed
  aliases:
  - getting spoon fed information
  meaning: Receiving answers from a partner without working them out; it speeds learning but leaves gaps
    and covers one perspective.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 4569
- term: mental blocks
  aliases:
  - champion mental blocks
  meaning: Mental blocks (\"champion mental blocks\") are beliefs a player holds about a champion, such
    as that it's broken, has no counterplay, or that they must win early with it (Elise, Rell). These
    beliefs make them play worse against it or with it. The hosts' example is Mel, where the community's
    \"broken, no counterplay\" reaction fueled narratives and a huge ban rate even though its win rate
    was low. They file this under \"stage four\" issues, meaning your relationship with the game.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 5072
  - episode_id: 2WQ8zHtK6fc
    t: 3775
  reviewed: suggested
- term: core mage
  aliases: []
  meaning: Your core mage is the one mage you make your main and stay on (e.g., Viktor) instead of running
    two hard mages like Viktor and Orianna. You then pepper in other champions around it, such as other
    mages or hybrids like Taliyah, Veigar, Aurora, Galio or TF, to fill archetypes and gaps the core doesn't
    cover. The host would optimally start doing this around mid-gold, but he is flexible and says it's
    fine earlier, even in silver.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 5355
  reviewed: suggested
- term: Mottism
  aliases: []
  meaning: A half-joking name one host suggests ('I like Mottism') for the hosts' own version of League
    of Legends language, the jargon they use that listeners may not follow, which came up while wrapping
    the dictionary episode. The origin is not explained, and the hosts don't clearly settle on it as the
    name. Rival suggestions such as Pinglish and Morganism are separate jokes.
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 5520
  reviewed: suggested
- term: process
  aliases: []
  meaning: A process is an intentional, deliberate way of conducting your League learning. You know what
    you're testing and you set the dials (how many games, what your reviews look like, how many days a
    week you play) to suit your schedule and energy, so you can see what works. It can be tailored however
    you like, including no reviews, short reviews or long reviews, but it has to be yours and it has to
    be real. A fake process goes through the steps without intensity, curiosity or accountability. Three-blocking
    is one possible part of a process and is a separate concept.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 282
  - episode_id: 2WQ8zHtK6fc
    t: 3409
  reviewed: suggested
- term: dials
  aliases:
  - dials on a wall
  meaning: The adjustable variables of your process (games per day, review length, days per week) tuned
    to your schedule and energy.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 311
- term: fake process
  aliases:
  - optical process
  meaning: Going through the steps of the process without real engagement, intensity, or curiosity, so
    it looks right but gives no learning.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 398
- term: toxic fake process
  aliases:
  - following the process to prove it doesn't work
  meaning: Deliberately following the process hollowly so you can claim it failed and blame the system.
  sources:
  - episode_id: ANlsvzO-fdc
    t: 520
- term: three block
  aliases:
  - 3 block
  - 3 blocking
  - three blocking
  - three block system
  - three block method
  - three block process
  - block
  - blocks
  - the block process
  - two block
  meaning: 'The hosts'' core session structure: play a set block of about three games (sometimes two or
    four) at high intensity and focus, then stop and take a break or play the next day, whatever the results
    (0-3, 1-2 or 3-0). It is a discipline tool that prevents tilt queuing, chasing LP, and playing marathon
    low-intensity sessions. It means fewer, higher-quality games with more learnings, and getting off
    the computer afterward.'
  sources:
  - episode_id: ANlsvzO-fdc
    t: 658
  - episode_id: ANlsvzO-fdc
