- term: lull state
  aliases:
  - lull states
  meaning: 'A lull state is any period of downtime in a game when little is happening and your mental
    stack is free, so you can think about the bigger picture instead of just controlling your character.
    It is relative to skill: clearing a camp or last hitting only counts once it is automatic. Major lull
    states are the long ones, such as being dead, recalling, or walking out of base after a reset. Miniature
    lull states are brief ones, such as between waves or trades, or mid-camp. Use them to gather information,
    plan objectives and a win condition, and prime your mental stack, not to alt-tab or let your mind
    wander.'
  sources:
  - episode_id: Jbw9Dq4GWUc
    t: 131
