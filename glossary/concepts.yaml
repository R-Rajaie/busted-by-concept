- term: flank
  aliases:
  - flanking
  - threaten flanks
  - flank angles
  - coming from behind
  meaning: Flanking means engaging from the side or behind instead of front to back. Flankers like Twitch,
    Rengar, Sett with Flash and Rek'Sai wait for the fight to start, then come from a creative angle to
    assassinate or scoop up the carries. The hosts' main use is against fed AD carries such as Smolder,
    who are strong front to back and weak when you get behind them, ideally with a side lane or other
    "multi-threat". NattyNatt's Rengar stays on the opposite side from his team while they siege so he
    can threaten flanks, and he comes from flank angles instead of using R straight forward.
  sources:
