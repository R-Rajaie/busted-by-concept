- term: weak side
  aliases:
  - weak-sided
  - 'weak-sided (verb: getting weak-sided)'
  - losing gracefully on weak side
  meaning: 'The side of the map, top or bot, where your team has a numbers disadvantage because the jungler
    and support are putting their resources and attention on the other side. It''s a game-state label,
    not a judgment on how well you''re playing. Because the jungler can''t be everywhere, someone is always
    weak-sided, and it can change within seconds in the mid game as objectives shift. On weak side you
    should play slow: don''t heavy trade, thin waves from a distance, ward defensively, concede plates
    or a wave rather than get dove, and lose gracefully. Then use the small windows you get to do something,
    and avoid dying, because that wastes waves and plates. The cost of dying depends on resources: dying
    weak-sided while you''re the carry is very costly, but dying while behind can drag enemy resources
    away from your fed teammates.'
  sources:
  - episode_id: EgAO9qiKYm4
    t: 4585
  - episode_id: gdXjxQlzZ34
    t: 4906
  - episode_id: HRYOKK6Dzlc
