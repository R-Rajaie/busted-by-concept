- term: neuro surgeon
  aliases:
  - neurosurgeon
  - neuroscientist (mock)
  - Dr. Curtis
  meaning: A running joke on the podcast. When the hosts talk about brain science, such as fight-or-flight
    versus the rational prefrontal cortex, tilt psychology, or neuroplasticity from reps, they jokingly
    say they are "not a neurosurgeon" or claim to be one. It works as a tongue-in-cheek disclaimer for
