- term: outplayed
  aliases:
  - getting outplayed
  - got outplayed
  meaning: 'Losing a fight or trade even though you made the right decision, because the opponent simply
    played it better. The hosts separate it from a wrong decision: in review, work out whether the call
    itself was right, since you can be 100% correct and still get outplayed, which happens all the time.
    It is not the same thing as a good death.'
  sources:
